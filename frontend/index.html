<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Smooth Journey · Cathay Accessibility App</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#006564">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#FBF8F3;
  --surface:#FFFFFF;
  --sand:#F4EDE0;
  --sand-line:#E6DEC8;
  --line:#E8E1D3;
  --ink:#1B2624;
  --muted:#5C6B67;
  --jade:#006564;
  --jade-d:#004A49;
  --jade-l:#107C7A;
  --jade-soft:#E7F2F0;
  --jade-mid:#C5DFDA;
  --gold:#B8862D;
  --gold-soft:#FDF5E3;
  --gold-line:#ECD39C;
  --ok:#1D7A4B;
  --ok-bg:#E6F5EC;
  --red:#B83227;
  --red-bg:#FDECEB;
  --shadow:0 4px 18px rgba(0,48,47,.07);
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#EDE8DD;color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* Desktop outer stage vs Mobile full-bleed */
.stage{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px 12px;background:radial-gradient(circle at top left,#dcebe8 0%,#ede8dd 55%,#e8dfcf 100%)}
.phone{width:100%;max-width:430px;height:min(860px,calc(100dvh - 36px));background:var(--bg);border-radius:36px;box-shadow:0 24px 64px rgba(0,42,41,.22),0 0 0 8px #182321;display:flex;flex-direction:column;overflow:hidden;position:relative}
@media(max-width:520px){
  .stage{padding:0;background:var(--bg)}
  .phone{max-width:100%;height:100dvh;border-radius:0;box-shadow:none}
}

/* App Top Bar */
.appbar{background:linear-gradient(135deg,var(--jade) 0%,var(--jade-d) 100%);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;box-shadow:0 2px 12px rgba(0,45,44,.18);z-index:10}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-wing{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;font-size:17px;flex-shrink:0}
.brand-title{font-weight:700;font-size:15.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11.5px;color:rgba(255,255,255,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.icon-btn{padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.16);color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.icon-btn:active{transform:scale(.96)}

/* Scrollable Screen Body */
.screen{flex:1;overflow-y:auto;padding:14px 14px 24px;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{width:0;height:0}

/* Bottom Tab Bar */
.tabbar{background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;align-items:stretch;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));flex-shrink:0;z-index:10}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;color:var(--muted);font-size:10.5px;font-weight:600;border-radius:12px;transition:.15s}
.tab .ico{font-size:18px;line-height:1.1}
.tab.on{color:var(--jade)}
.tab.on .ico{transform:translateY(-1px)}

/* Cards & Typography */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow);margin-bottom:12px}
.card.hero{background:linear-gradient(140deg,var(--jade) 0%,var(--jade-d) 100%);color:#fff;border:0}
.card.sand{background:var(--sand);border-color:var(--sand-line)}
.card.jade{background:var(--jade-soft);border-color:var(--jade-mid)}
.card.gold{background:var(--gold-soft);border-color:var(--gold-line)}
.card.bad{background:var(--red-bg);border-color:#f2b8b2}
h1{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
h2{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
h3{font-size:14.5px;font-weight:700}
.sub{font-size:13.5px;color:var(--muted)}
.card.hero .sub{color:rgba(255,255,255,.84)}
.small{font-size:12.5px;color:var(--muted)}
.card.hero .small{color:rgba(255,255,255,.8)}
.mt1{margin-top:8px}
.mt2{margin-top:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Pills & Codes */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:#efeae0;color:var(--ink)}
.pill.jade{background:var(--jade-soft);color:var(--jade)}
.pill.gold{background:var(--gold-soft);color:#8a5e10;border:1px solid var(--gold-line)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.glass{background:rgba(255,255,255,.18);color:#fff}
.code{display:inline-block;padding:3px 8px;border-radius:7px;background:var(--jade);color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;font-weight:700;letter-spacing:.03em}

/* Buttons & Inputs (thumb-friendly) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:13px;background:var(--jade);color:#fff;font-weight:700;font-size:14px;transition:.12s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.btn.sec{background:var(--jade-soft);color:var(--jade)}
.btn.gold{background:var(--gold);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:12.5px;border-radius:10px}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px 13px;background:#fff;font-size:14px;outline:none}
textarea:focus,input[type=text]:focus{border-color:var(--jade);box-shadow:0 0 0 3px rgba(0,101,100,.12)}
textarea{min-height:96px;resize:vertical}

/* Segmented Toggle & Chips */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--sand);padding:4px;border-radius:14px;border:1px solid var(--sand-line)}
.seg button{padding:9px 8px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--muted);transition:.15s;text-align:center}
.seg button.on{background:#fff;color:var(--jade);box-shadow:0 2px 8px rgba(0,0,0,.07)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600}
.chip.on{background:var(--jade);color:#fff;border-color:var(--jade)}

/* Role list & timeline */
.role-btn{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:15px;background:#fff;width:100%;text-align:left;transition:.12s}
.role-btn:active{transform:scale(.99);background:var(--jade-soft);border-color:var(--jade-mid)}
.role-ico{width:40px;height:40px;border-radius:12px;background:var(--jade-soft);color:var(--jade);display:grid;place-items:center;font-size:19px;flex-shrink:0}
.list{list-style:none;display:flex;flex-direction:column;gap:9px}
.list li{display:flex;align-items:flex-start;gap:8px;font-size:13.5px}
.step{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f1ece1}
.step:last-child{border-bottom:0}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:0 0 24px;background:#ebe5d8;color:var(--muted)}
.dot.ok{background:var(--ok);color:#fff}
.dot.now{background:var(--gold);color:#fff}
.redact{background:var(--sand);border:1px dashed #cfc5ae;border-radius:11px;padding:9px 11px;font-size:12.5px}
.redact mark{background:#fde5a2;padding:1px 4px;border-radius:4px}

/* Boarding-pass progress bar */
.prog{height:6px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:10px}
.prog>div{height:100%;background:#f0c46c;border-radius:99px;transition:width .3s}

/* QR Modal */
.modal-bg{position:absolute;inset:0;background:rgba(16,28,26,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:18px;z-index:50}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:24px;padding:20px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.28)}
.qr-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:inline-block;margin:12px 0}
</style>
</head>
<body>

<div class="stage">
  <div class="phone">
    <header class="appbar" id="appBar"></header>
    <main class="screen" id="screen"></main>
    <nav class="tabbar" id="tabBar" style="display:none"></nav>
    <div class="modal-bg" id="qrModal" style="display:none" onclick="if(event.target===this)toggleQR(false)"></div>
  </div>
</div>

<script>
"use strict";

const ROLES = [
  { id:"passenger", ico:"👤", title:"Passenger / Cathay Member", sub:"Travel Needs Profile, booking & Plan approvals" },
  { id:"carer", ico:"💛", title:"Carer / Family Member", sub:"Plain-language live milestone tracker from home" },
  { id:"staff", ico:"🪪", title:"Ground Staff · Special Assistance", sub:"Confirm codes, view Help Card & scan handovers" },
  { id:"crew", ico:"✈️", title:"Cabin Crew · Purser Tablet", sub:"Approved brief, Version 2 updates & discreet alerts" },
  { id:"manager", ico:"📊", title:"Duty Manager · Ground Control", sub:"Live handovers, Disruption Guard & HKIA demand" }
];

const TABS = {
  passenger: [
    { id:"home", ico:"🏠", label:"Home" },
    { id:"profile", ico:"🪪", label:"Profile" },
    { id:"plan", ico:"📋", label:"Plan" },
    { id:"journey", ico:"🛫", label:"Journey" },
    { id:"ask", ico:"💬", label:"Ask" }
  ],
  carer: [
    { id:"live", ico:"📍", label:"Live" },
    { id:"updates", ico:"🔔", label:"Updates" },
    { id:"privacy", ico:"🔒", label:"Privacy" }
  ],
  staff: [
    { id:"queue", ico:"🪪", label:"Codes" },
    { id:"card", ico:"💛", label:"Help Card" },
    { id:"handover", ico:"✅", label:"Handover" }
  ],
  crew: [
    { id:"brief", ico:"📋", label:"Brief" },
    { id:"alerts", ico:"🔔", label:"Alerts" },
    { id:"arrival", ico:"🛬", label:"Arrival" }
  ],
  manager: [
    { id:"ops", ico:"📊", label:"Ops" },
    { id:"guard", ico:"🛡️", label:"Swap Guard" },
    { id:"flights", ico:"🛫", label:"HKIA" }
  ]
};

let SESSION = { loggedIn:false, role:"passenger", persona:"leo", tab:"home" };
let STATE = null;
let HEALTH = { ok:false, ai:false, model:"", cathayMode:"mock" };
let FLIGHTS = null;
let BUSY = false;

const $ = (s) => document.querySelector(s);
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (m) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}
function markRedactions(s) {
  return esc(s).replace(/\[(name|age|phone|email|ID number|document number|condition)\]/g, "<mark>$1</mark>");
}

async function loadHealth() {
  try {
    const r = await fetch("/api/health", { cache:"no-store" });
    if (r.ok) HEALTH = await r.json();
  } catch {}
  renderAppBar();
}

async function loadFlights() {
  try {
    const r = await fetch("/api/flights", { cache:"no-store" });
    if (r.ok) FLIGHTS = await r.json();
  } catch {}
  render();
}

async function fetchState() {
  const r = await fetch(`/api/journey/state?role=${encodeURIComponent(SESSION.role)}&persona=${encodeURIComponent(SESSION.persona)}`, { cache:"no-store" });
  if (r.ok) STATE = await r.json();
  render();
}

async function act(type, payload = {}) {
  BUSY = true;
  render();
  try {
    const r = await fetch("/api/journey/action", {
      method:"POST",
      headers:{ "content-type":"application/json" },
      body:JSON.stringify({ role:SESSION.role, persona:SESSION.persona, type, ...payload })
    });
    if (r.ok) STATE = await r.json();
  } finally {
    BUSY = false;
    render();
  }
}

function signIn(role) {
  SESSION.role = role;
  SESSION.loggedIn = true;
  SESSION.tab = TABS[role][0].id;
  fetchState();
  if (role === "manager" && !FLIGHTS) loadFlights();
}

function signOut() {
  SESSION.loggedIn = false;
  STATE = null;
  render();
}

function setPersona(p) {
  SESSION.persona = p;
  render();
}

function setTab(id) {
  SESSION.tab = id;
  render();
}

function toggleQR(show) {
  const m = $("#qrModal");
  if (!show) { m.style.display = "none"; return; }
  const url = window.location.href.split("#")[0];
  const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&color=006564&bgcolor=FFFFFF&data=${encodeURIComponent(url)}`;
  m.innerHTML = `
    <div class="modal">
      <span class="pill jade">Mobile Web App</span>
      <h2 class="mt1">Scan to open on your phone</h2>
      <p class="small mt1">Point your phone camera at this QR code to test Smooth Journey directly on mobile.</p>
      <div class="qr-box">
        <img src="${qrSrc}" alt="QR Code" width="190" height="190" style="display:block;border-radius:8px">
      </div>
      <div class="small" style="word-break:break-all;background:var(--sand);padding:8px 10px;border-radius:10px">${esc(url)}</div>
      <div class="row mt2">
        <button class="btn sec full" onclick="navigator.clipboard?.writeText('${esc(url)}');this.textContent='Copied link ✓'">Copy link</button>
        <button class="btn ghost full" onclick="toggleQR(false)">Close</button>
      </div>
    </div>`;
  m.style.display = "grid";
}

function renderAppBar() {
  const bar = $("#appBar");
  if (!SESSION.loggedIn) {
    bar.innerHTML = `
      <div class="brand">
        <div class="brand-wing">✈</div>
        <div>
          <div class="brand-title">Smooth Journey</div>
          <div class="brand-sub">Cathay Accessibility Companion</div>
        </div>
      </div>
      <div class="appbar-actions">
        <button class="icon-btn" onclick="toggleQR(true)">📱 QR</button>
      </div>`;
    return;
  }
  const r = ROLES.find((x) => x.id === SESSION.role);
  const who = SESSION.role === "passenger" && STATE ? STATE.persona.account :
              SESSION.role === "carer" && STATE ? STATE.persona.carer :
              (r ? r.title.split("·")[0].trim() : SESSION.role);
  bar.innerHTML = `
    <div class="brand">
      <div class="brand-wing">${r ? r.ico : "✈"}</div>
      <div style="min-width:0">
        <div class="brand-title">${esc(who)}</div>
        <div class="brand-sub">${STATE ? `${esc(STATE.persona.flight)} · ${esc(STATE.persona.route)}` : "Smooth Journey"}</div>
      </div>
    </div>
    <div class="appbar-actions">
      <button class="icon-btn" onclick="toggleQR(true)">📱</button>
      <button class="icon-btn" onclick="signOut()">Switch</button>
    </div>`;
}

function renderTabBar() {
  const tb = $("#tabBar");
  if (!SESSION.loggedIn) { tb.style.display = "none"; return; }
  const list = TABS[SESSION.role] || [];
  tb.style.display = "flex";
  tb.innerHTML = list.map((t) => `
    <button class="tab ${SESSION.tab === t.id ? "on" : ""}" onclick="setTab('${t.id}')">
      <span class="ico">${t.ico}</span>
      <span>${t.label}</span>
    </button>`).join("");
}

function renderLogin() {
  return `
    <div class="card hero">
      <span class="pill glass">${HEALTH.ai ? "✦ Gemini AI Ready" : "✦ Built-in Rules"} · Cathay ${esc(HEALTH.cathayMode || "mock")}</span>
      <h1 class="mt1">Being known before you arrive.</h1>
      <p class="sub mt1">One Travel Needs Profile in your Cathay membership—shared across booking, airport transfer, gate, and cabin crew.</p>
    </div>

    <div class="card sand">
      <h3>1. Choose passenger journey</h3>
      <div class="seg mt1">
        <button class="${SESSION.persona === "leo" ? "on" : ""}" onclick="setPersona('leo')">Grace &amp; Leo (8)<br><span style="font-weight:500;font-size:11px">SYD → HKG → LHR</span></button>
        <button class="${SESSION.persona === "chan" ? "on" : ""}" onclick="setPersona('chan')">Mrs Chan (78)<br><span style="font-weight:500;font-size:11px">HKG → LHR · WCHR</span></button>
      </div>
    </div>

    <div class="card">
      <h3>2. Sign in to the app</h3>
      <p class="small">Actions in one account update the live journey for all others.</p>
      <div class="list mt2">
        ${ROLES.map((r) => `
          <button class="role-btn" onclick="signIn('${r.id}')">
            <div class="role-ico">${r.ico}</div>
            <div style="flex:1;min-width:0">
              <div style="font-weight:700;font-size:14px">${r.title}</div>
              <div class="small">${r.sub}</div>
            </div>
            <span style="color:var(--jade);font-weight:800;font-size:16px">›</span>
          </button>`).join("")}
      </div>
    </div>

    <button class="btn sec full" onclick="toggleQR(true)">📱 Scan QR code to open on phone</button>
    <p class="small mt2" style="text-align:center">Team E394 prototype · No real personal data</p>`;
}

/* ---------------- PASSENGER APP ---------------- */
function renderPassenger() {
  const s = STATE, per = s.persona, p = s.profile, b = s.booking, pl = s.plan, t = s.travel;
  const pct = Math.round((Math.min(t.stage, s.stages.length) / s.stages.length) * 100);

  if (SESSION.tab === "home") {
    return `
      <div class="card hero">
        <div class="row between">
          <span class="pill glass">${esc(per.flight)} · ${esc(b.seat)}</span>
          <span class="pill gold">Plan v${pl.version}</span>
        </div>
        <h1 class="mt1">${esc(per.route)}</h1>
        <p class="sub">${esc(per.passenger)} · ${b.booked ? `Booking ${esc(b.ref)} confirmed` : "Ready to apply profile"}</p>
        <div class="prog"><div style="width:${pct}%"></div></div>
        <div class="row between mt1"><span class="small">${t.active ? `Stage ${Math.min(t.stage + 1, s.stages.length)} of ${s.stages.length}` : "Pre-travel setup"}</span><span class="small">${pct}%</span></div>
      </div>

      <div class="grid2">
        <div class="card" onclick="setTab('profile')" style="cursor:pointer">
          <span class="pill ${p.savedToMembership ? "ok" : "jade"}">${p.savedToMembership ? "Saved ✓" : p.status === "draft" ? "Draft" : "Step 1"}</span>
          <h3 class="mt1">Needs Profile</h3>
          <p class="small">${p.codes.length ? `${p.codes.length} codes matched` : "Write in plain words"}</p>
        </div>
        <div class="card" onclick="setTab('plan')" style="cursor:pointer">
          <span class="pill ${pl.brief.status === "approved" ? "ok" : "gold"}">${pl.brief.status === "approved" ? "Approved ✓" : "Step 2"}</span>
          <h3 class="mt1">Book &amp; Plan</h3>
          <p class="small">${b.booked ? "Written to booking" : "Apply in one tap"}</p>
        </div>
      </div>

      <div class="card sand">
        <div class="row between">
          <h3>Quick Travel Actions</h3>
          <span class="pill jade">Live</span>
        </div>
        <div class="grid2 mt1">
          <button class="btn gold sm" onclick="act('requestHelp')">🔔 Need help now</button>
          <button class="btn sec sm" onclick="act('changePlan',{note:'Quiet room before boarding'})">✨ Update to v${pl.version + 1}</button>
        </div>
        ${t.helpRequested ? `<p class="small mt1">${t.helpAcked ? "✓ Staff acknowledged and are on the way." : "Alert sent to your assigned staff member."}</p>` : ""}
      </div>

      <div class="card">
        <h3>Privacy &amp; Consent</h3>
        <div class="row mt1">
          <button class="btn ${s.consent.carer ? "sec" : "ghost"} sm" onclick="act('consent',{key:'carer'})">Carer: ${s.consent.carer ? "ON" : "OFF"}</button>
          <button class="btn ${s.consent.crew ? "sec" : "ghost"} sm" onclick="act('consent',{key:'crew'})">Crew Brief: ${s.consent.crew ? "ON" : "OFF"}</button>
          <button class="btn ${s.consent.ai ? "sec" : "ghost"} sm" onclick="act('consent',{key:'ai'})">Gemini AI: ${s.consent.ai ? "ON" : "OFF"}</button>
        </div>
        <div class="small mt1">${s.accessLog.length ? `Latest log: <b>${esc(s.accessLog[0].who)}</b> — ${esc(s.accessLog[0].what)}` : "No plan accesses logged yet."}</div>
      </div>`;
  }

  if (SESSION.tab === "profile") {
    return `
      <div class="card">
        <div class="row between">
          <h2>Travel Needs Profile</h2>
          ${p.savedToMembership ? `<span class="pill ok">Saved ✓</span>` : ""}
        </div>
        <p class="small mt1">Personal details and diagnoses are stripped before AI maps needs onto Cathay's fixed service menu.</p>
        <div class="chips mt1">
          <button class="chip" onclick="document.getElementById('rawNeeds').value='${esc(per.defaultText)}'">Reset words</button>
          <button class="chip" onclick="document.getElementById('rawNeeds').value+=' Also needs oxygen on board.'">+ Test oxygen trigger</button>
        </div>
        <textarea id="rawNeeds" class="mt1">${esc(p.rawText)}</textarea>
        <button class="btn full mt1" ${BUSY ? "disabled" : ""} onclick="act('matchProfile',{text:document.getElementById('rawNeeds').value})">Match to fixed service menu</button>
        ${p.savedToMembership ? `<button class="btn ghost full mt1" onclick="act('deleteProfile')">Delete saved profile</button>` : ""}
      </div>

      ${p.status !== "none" ? `
      <div class="card">
        <div class="row between">
          <h3>Matched Services</h3>
          <span class="pill ${p.source === "ai" ? "jade" : "gold"}">${p.source === "ai" ? "✦ Gemini AI" : "Rules"}</span>
        </div>
        ${p.redacted ? `<div class="redact mt1"><div class="small">Redacted before AI:</div>${markRedactions(p.redacted)}</div>` : ""}
        <ul class="list mt1">
          ${p.codes.map((c) => `<li><span class="code">${esc(c.code)}</span><span>${esc(c.desc)} ${c.needsStaffConfirmation ? '<span class="pill gold">staff confirm</span>' : ""}</span></li>`).join("")}
        </ul>
        <p class="small mt1"><b>Wheelchair tier:</b> ${esc(p.wheelchairTier)}</p>
        ${p.medif ? `<div class="card gold mt1" style="margin-bottom:0"><b>${esc(p.medifMessage)}</b><p class="small">Medical triggers are never added as booking codes. Status: <code>${esc(p.clearanceStatus)}</code></p></div>` : ""}
        ${!p.savedToMembership ? `<button class="btn sec full mt2" onclick="act('saveProfile')">Save to ${esc(per.account)}'s membership</button>` : ""}
      </div>` : ""}`;
  }

  if (SESSION.tab === "plan") {
    return `
      <div class="card">
        <div class="row between">
          <h2>Booking · ${esc(per.flight)}</h2>
          <span class="pill jade">${esc(b.seat)}</span>
        </div>
        <p class="small mt1">Protected bulkhead seat (needs-based) · 48-hour assistance guarantee</p>
        ${p.codes.length && !b.booked ? `<button class="btn full mt2" ${BUSY ? "disabled" : ""} onclick="act('applyAndBook')">Apply ${p.codes.length} services &amp; write to booking</button>` : ""}
        ${!p.codes.length ? `<div class="card sand mt1" style="margin-bottom:0"><p class="small">Set your Travel Needs Profile first, then apply it here.</p></div>` : ""}
        ${b.booked ? `<div class="card jade mt1" style="margin-bottom:0"><div class="row between"><b>Written to booking ✓</b><span class="pill jade">${esc(b.cathaySource)}</span></div><p class="small">Ref: <b>${esc(b.ref)}</b> · Bulkhead protected</p></div>` : ""}
      </div>

      ${pl.confirmed ? `
      <div class="card jade">
        <div class="row between">
          <h3>"How to help ${esc(per.passenger.split(" ")[0])}" card</h3>
          <span class="pill ${pl.helpCard.status === "approved" ? "ok" : "gold"}">${pl.helpCard.status === "approved" ? "Approved ✓" : "Draft"}</span>
        </div>
        <ul class="list mt1">${pl.helpCard.lines.map((l) => `<li>• ${esc(l)}</li>`).join("")}</ul>
      </div>
      <div class="card">
        <div class="row between">
          <h3>Cabin Crew Brief (v${pl.version})</h3>
          <span class="pill ${pl.brief.status === "approved" ? "ok" : "gold"}">${pl.brief.status === "approved" ? "Approved ✓" : "Draft"}</span>
        </div>
        ${pl.changeNote ? `<p class="small mt1">✨ <b>v${pl.version}:</b> ${esc(pl.changeNote)}</p>` : ""}
        <textarea id="briefEdit" class="mt1" style="min-height:78px">${esc(pl.brief.text)}</textarea>
        ${pl.brief.status !== "approved" ? `<button class="btn full mt1" onclick="act('approveBriefAndCard',{briefText:document.getElementById('briefEdit').value})">Approve v${pl.version} brief &amp; card</button>` : ""}
        <button class="btn sec full mt1" onclick="act('changePlan',{note:'Quiet room before boarding'})">Change plan (add Quiet room)</button>
      </div>` : ""}`;
  }

  if (SESSION.tab === "journey") {
    return `
      <div class="card">
        <div class="row between">
          <h2>Live Journey</h2>
          <span class="pill ${pl.version > 1 ? "gold" : "jade"}">Plan v${pl.version}</span>
        </div>
        ${t.aircraftSwap ? `<div class="card gold mt1"><b>Aircraft swap (${esc(t.aircraftSwap.newAircraft)})</b><p class="small">${t.aircraftSwap.status === "approved" ? "Duty Manager approved · Bulkhead kept (" + esc(b.seat) + ")." : "Re-checking bulkhead protection…"}</p></div>` : ""}
        <div class="mt1">
          ${s.stages.map((st, i) => `
            <div class="step">
              <div class="dot ${i < t.stage ? "ok" : i === t.stage ? "now" : ""}">${i < t.stage ? "✓" : i + 1}</div>
              <div>
                <div style="font-weight:700;font-size:13.5px">${esc(st.name)}</div>
                <div class="small">${esc(st.where)} · ${esc(st.owner)}</div>
              </div>
            </div>`).join("")}
        </div>
      </div>`;
  }

  return `
    <div class="card">
      <h2>Ask Accessibility Policy</h2>
      <p class="small mt1">Strictly from Cathay policy excerpts. Battery &amp; medical questions route to a specialist.</p>
      <div class="chips mt1">
        <button class="chip" onclick="act('ask',{question:'Where can we wait somewhere quiet?'})">Quiet spaces?</button>
        <button class="chip" onclick="act('ask',{question:'Can I bring a lithium battery?'})">Lithium battery?</button>
        <button class="chip" onclick="act('ask',{question:'Can I bring my folding wheelchair?'})">Folding chair?</button>
      </div>
      <div class="row mt1">
        <input type="text" id="askQ" placeholder="Ask a question..." style="flex:1">
        <button class="btn sm" onclick="act('ask',{question:document.getElementById('askQ').value})">Send</button>
      </div>
      <div class="list mt2">
        ${s.chat.map((m) => `<li class="card ${m.from === "me" ? "jade" : m.from === "human" ? "gold" : ""}" style="margin-bottom:0;display:block;padding:11px"><b>${m.from === "me" ? "You" : m.from === "human" ? "Accessibility Specialist" : "Policy Assistant"}</b><div class="small mt1">${esc(m.text)} ${m.source ? `<span class="pill jade">${esc(m.source)}</span>` : ""}</div></li>`).join("")}
      </div>
    </div>`;
}

/* ---------------- CARER APP ---------------- */
function renderCarer() {
  const s = STATE, per = s.persona;
  if (s.paused) {
    return `<div class="card gold"><h2>Sharing is paused</h2><p class="small mt1">${esc(per.account)} turned off Carer Mode. No updates are shown while sharing is paused.</p></div>`;
  }
  if (SESSION.tab === "live") {
    const pct = Math.round((Math.min(s.travel.stage, s.stages.length) / s.stages.length) * 100);
    return `
      <div class="card hero">
        <span class="pill glass">Following ${esc(per.passenger)}</span>
        <h1 class="mt1">${esc(s.travel.stageName)}</h1>
        <p class="sub">${esc(per.flight)} · ${esc(per.route)}</p>
        <div class="prog"><div style="width:${pct}%"></div></div>
      </div>
      <div class="card">
        <h3>Journey Milestones</h3>
        <div class="mt1">
          ${s.stages.map((st, i) => `
            <div class="step">
              <div class="dot ${i < s.travel.stage ? "ok" : i === s.travel.stage ? "now" : ""}">${i < s.travel.stage ? "✓" : i + 1}</div>
              <div>
                <div style="font-weight:700;font-size:13.5px">${esc(st.name)}</div>
                <div class="small">${esc(st.owner)}</div>
              </div>
            </div>`).join("")}
        </div>
      </div>`;
  }
  if (SESSION.tab === "updates") {
    return `
      <div class="card">
        <h3>Live Updates</h3>
        <p class="small mt1">Updates come from staff scans—even if the traveller's phone is off.</p>
        <ul class="list mt2">${s.updates.length ? s.updates.map((u) => `<li><span class="pill jade">${esc(u.t)}</span><span>${esc(u.text)}</span></li>`).join("") : `<li class="small">Waiting for booking and check-in updates.</li>`}</ul>
      </div>`;
  }
  return `
    <div class="card sand">
      <h3>Carer Privacy Guarantee</h3>
      <p class="small mt1">You see plain-language journey milestones only. Service codes, medical clearances, and staff help cards are never shown to Carer accounts.</p>
    </div>`;
}

/* ---------------- STAFF APP ---------------- */
function renderStaff() {
  const s = STATE, per = s.persona, p = s.profile, t = s.travel;
  const st = s.stages[Math.min(t.stage, s.stages.length - 1)];

  if (SESSION.tab === "queue") {
    return `
      <div class="card hero">
        <div class="row between">
          <span class="pill glass">${esc(st.name)}</span>
          <span class="pill gold">Plan v${s.planVersion}</span>
        </div>
        <h1 class="mt1">${esc(per.passenger)}</h1>
        <p class="sub">${esc(s.booking.flight)} · ${esc(s.booking.route)} · Seat ${esc(s.booking.seat)}</p>
      </div>
      ${t.helpRequested && !t.helpAcked ? `<div class="card bad"><div class="row between"><b>⚠ Help requested at ${esc(st.where)}</b><button class="btn sm" onclick="act('ackHelp')">On my way</button></div></div>` : ""}
      ${s.planChange ? `<div class="card gold"><b>Updated in v${s.planVersion}:</b> ${esc(s.planChange)}</div>` : ""}
      <div class="card">
        <h3>Confirmed Service Codes</h3>
        <p class="small">Wheelchair tier: <b>${esc(p.wheelchairTier)}</b></p>
        ${p.medif ? `<div class="card gold mt1"><b>${esc(p.medifMessage)}</b> (${esc(p.clearanceStatus)})</div>` : ""}
        <ul class="list mt1">${p.codes.length ? p.codes.map((c, i) => `<li><span class="code">${esc(c.code)}</span><span style="flex:1">${esc(c.desc)}</span>${p.status === "draft" ? `<button class="btn ghost sm" onclick="act('removeCode',{index:${i}})">✕</button>` : ""}</li>`).join("") : `<li class="small">No codes submitted yet.</li>`}</ul>
        ${p.status === "draft" ? `<button class="btn full mt2" onclick="act('confirmCodes')">Confirm codes</button>` : ""}
      </div>`;
  }
  if (SESSION.tab === "card") {
    return s.helpCard.lines.length ? `
      <div class="card jade">
        <div class="row between"><h3>How to help ${esc(per.passenger.split(" ")[0])}</h3><span class="pill ${s.helpCard.status === "approved" ? "ok" : "gold"}">${s.helpCard.status === "approved" ? "Approved ✓" : "Draft"}</span></div>
        <ul class="list mt2">${s.helpCard.lines.map((l) => `<li>• ${esc(l)}</li>`).join("")}</ul>
      </div>` : `<div class="card sand"><p class="small">How to help card will appear once the passenger books and generates their plan.</p></div>`;
  }
  return `
    <div class="card">
      <h3>Handover Scanner</h3>
      <p class="small mt1">Current stage: <b>${t.stage >= s.stages.length ? "Complete" : esc(st.name)}</b></p>
      ${t.stage >= s.stages.length ? `<div class="card jade mt2"><b>All 6 handovers complete ✓</b></div>` : `<button class="btn full mt2" onclick="act('completeHandover')">Scan card &amp; complete: ${esc(st.name)}</button>`}
    </div>`;
}

/* ---------------- CREW TABLET ---------------- */
function renderCrew() {
  const s = STATE, per = s.persona, b = s.booking, t = s.travel;
  if (SESSION.tab === "brief") {
    return `
      <div class="card hero">
        <div class="row between">
          <span class="pill glass">Cabin Crew · ${esc(b.flight)}</span>
          <span class="pill gold">v${s.planVersion}</span>
        </div>
        <h1 class="mt1">${esc(per.passenger)} · ${esc(b.seat)}</h1>
        ${s.planChange ? `<p class="sub mt1">✨ Updated in v${s.planVersion}: ${esc(s.planChange)}</p>` : ""}
      </div>
      <div class="card">
        <div class="row between"><h3>Approved Crew Brief</h3><span class="pill ${s.brief.status === "approved" ? "ok" : "gold"}">${esc(s.brief.status)}</span></div>
        <p class="mt1">${esc(s.brief.text || "Awaiting passenger approval of crew brief.")}</p>
        <div class="chips mt2">${(s.codes || []).map((c) => `<span class="code">${esc(c.code)}</span>`).join("")}</div>
      </div>`;
  }
  if (SESSION.tab === "alerts") {
    return t.crewHelpRequested && !t.crewHelpAcked
      ? `<div class="card bad"><b>🔔 Discreet help request · ${esc(b.seat)}</b><button class="btn full mt2" onclick="act('ackCrewHelp')">Acknowledge discreetly</button></div>`
      : `<div class="card sand"><h3>Cabin Alerts</h3><p class="small mt1">No active discreet assistance requests.</p></div>`;
  }
  return `
    <div class="card">
      <h3>Arrival Handover</h3>
      <p class="small mt1">Hand over care notes cleanly to the Heathrow arrival team.</p>
      ${t.stage === 3 ? `<button class="btn full mt2" onclick="act('handoverArrival')">Hand over to Heathrow arrival team</button>` : `<div class="card jade mt2"><p class="small">${t.stage > 3 ? "Handed over to Heathrow team ✓" : "Available once in-flight stage (Stage 4) is active."}</p></div>`}
    </div>`;
}

/* ---------------- DUTY MANAGER ---------------- */
function renderManager() {
  const s = STATE, per = s.persona, t = s.travel, b = s.booking, sw = t.aircraftSwap;
  if (SESSION.tab === "ops") {
    return `
      <div class="card hero">
        <span class="pill glass">HKIA Ground Control · Read-only</span>
        <h1 class="mt1">Live Operations</h1>
        <p class="sub">${esc(per.passenger)} · ${esc(b.flight)} · ${esc(b.seat)}</p>
      </div>
      <div class="card">
        <h3>Current Handover Stage</h3>
        <p class="mt1"><b>${t.stage >= s.stages.length ? "Complete ✓" : esc(s.stages[t.stage].name)}</b></p>
        <p class="small mt1">Plan version: v${s.planVersion}</p>
      </div>`;
  }
  if (SESSION.tab === "guard") {
    return `
      <div class="card ${sw && sw.status === "pending" ? "gold" : ""}">
        <h3>Disruption Guard (Aircraft Swap)</h3>
        ${!sw ? `<p class="small mt1">Simulate an aircraft swap to verify protected bulkhead seat handling.</p><button class="btn gold full mt2" onclick="act('simulateSwap')">Simulate aircraft swap</button>` :
          sw.status === "pending" ? `<p class="small mt1"><b>Swapped to ${esc(sw.newAircraft)}</b> · Bulkhead kept (${esc(sw.newSeat)}) ✓</p><button class="btn full mt2" onclick="act('approveSwap')">Approve new plan</button>` :
          `<p class="small mt1"><b>Approved ✓</b> · ${esc(sw.newAircraft)} · Bulkhead kept (${esc(b.seat)})</p>`}
      </div>`;
  }
  return `
    <div class="card">
      <h3>HKIA Departure Demand (DATA.GOV.HK)</h3>
      ${FLIGHTS ? `<p class="mt1"><b>${FLIGHTS.total}</b> Cathay departures on ${esc(FLIGHTS.date)}</p><p class="small">Source: ${esc(FLIGHTS.source)}</p>` : `<p class="small mt1">Loading HKIA open data…</p>`}
    </div>`;
}

function render() {
  renderAppBar();
  renderTabBar();
  const sc = $("#screen");
  if (!SESSION.loggedIn || !STATE) {
    sc.innerHTML = renderLogin();
    return;
  }
  if (SESSION.role === "passenger") sc.innerHTML = renderPassenger();
  else if (SESSION.role === "carer") sc.innerHTML = renderCarer();
  else if (SESSION.role === "staff") sc.innerHTML = renderStaff();
  else if (SESSION.role === "crew") sc.innerHTML = renderCrew();
  else sc.innerHTML = renderManager();
  sc.scrollTop = 0;
}

loadHealth();
render();
</script>
</body>
</html>
