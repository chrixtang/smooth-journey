<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smooth Journey</title>
<meta name="description" content="Joined-up travel assistance from booking to arrival. Student concept prototype.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#006564">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --jade:#006564; --jade-700:#00514F; --jade-900:#003C3B;
  --jade-50:#EBF4F3; --jade-100:#D3E7E5; --jade-200:#A9CFCB;
  --bg:#F3F5F5; --surface:#FFFFFF; --line:#E2E8E7; --line-2:#EEF2F1;
  --ink:#16201F; --ink-2:#44524F; --muted:#77847F;
  --amber:#9A6200; --amber-bg:#FFF5E1; --amber-line:#F1D9A6;
  --red:#B42318; --red-bg:#FDEDEB; --red-line:#F5C2BC;
  --ok:#14774D; --ok-bg:#E6F4EC;
  --gold:#B39257;
  --r:18px; --r-sm:12px;
  --sh:0 1px 2px rgba(16,40,38,.04),0 4px 14px rgba(16,40,38,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#E4EAE9;color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;font-size:15px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:inherit}
svg.i{flex-shrink:0;display:block}

/* ---------- device frame ---------- */
.stage{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 15% -10%,#D6E8E5 0%,transparent 60%),radial-gradient(900px 600px at 110% 110%,#DCE5E3 0%,transparent 55%),#E8EDEC}
.phone{width:100%;max-width:410px;height:min(880px,calc(100dvh - 48px));background:var(--bg);border-radius:44px;box-shadow:0 0 0 10px #111A19,0 0 0 11px #2A3634,0 40px 80px rgba(0,40,38,.25);display:flex;flex-direction:column;overflow:hidden;position:relative;isolation:isolate}
@media(max-width:520px){.stage{padding:0;background:var(--bg)}.phone{max-width:100%;height:100dvh;border-radius:0;box-shadow:none}}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;padding-top:calc(14px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--line-2);flex-shrink:0;z-index:5;min-height:62px}
.top .t1{font-weight:700;font-size:15.5px;letter-spacing:-.01em;line-height:1.2}
.top .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grow{flex:1;min-width:0}
.mark{width:32px;height:32px;border-radius:10px;background:var(--jade);display:grid;place-items:center;flex-shrink:0}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--jade-50);color:var(--jade);font-weight:700;font-size:13px;display:grid;place-items:center;border:1px solid var(--jade-100)}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:active{background:var(--line-2)}

/* ---------- screen ---------- */
.screen{flex:1;overflow-y:auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch;scroll-behavior:auto}
.screen::-webkit-scrollbar{width:0}
.screen>*{flex-shrink:0}
.h1{font-size:24px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.h2{font-size:17px;font-weight:700;letter-spacing:-.015em}
.h3{font-size:15px;font-weight:650}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--muted)} .sm{font-size:13px} .xs{font-size:12px}
.ink2{color:var(--ink-2)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column}
.gap4{gap:4px}.gap8{gap:8px}.gap12{gap:12px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.grow{flex:1;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card.flat{box-shadow:none}
.card.tint{background:var(--jade-50);border-color:var(--jade-100);box-shadow:none}
.card.warn{background:var(--amber-bg);border-color:var(--amber-line);box-shadow:none}
.card.alert{background:var(--red-bg);border-color:var(--red-line);box-shadow:none}
.card.pad0{padding:0;overflow:hidden}
.sec-title{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 0}

/* boarding pass */
.pass{border-radius:22px;color:#fff;background:linear-gradient(150deg,#007572 0%,#006564 45%,#004A49 100%);padding:18px 18px 16px;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(0,80,78,.22)}
.pass::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:28px solid rgba(255,255,255,.05)}
.pass .ap{font-size:30px;font-weight:700;letter-spacing:.02em;line-height:1}
.pass .city{font-size:11.5px;opacity:.78;margin-top:3px}
.pass .route{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-top:16px}
.pass .leg{flex:1;display:flex;align-items:center;gap:6px;padding-top:9px;opacity:.75}
.pass .leg i{flex:1;height:0;border-top:1.5px dashed rgba(255,255,255,.55)}
.pass .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.16)}
.pass .meta b{display:block;font-size:14px;font-weight:650;margin-top:1px}
.pass .meta span{font-size:11px;opacity:.72;text-transform:uppercase;letter-spacing:.05em}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill.jade{background:var(--jade-50);color:var(--jade)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.glass{background:rgba(255,255,255,.16);color:#fff}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.code{display:inline-flex;align-items:center;justify-content:center;min-width:52px;padding:4px 8px;border-radius:8px;background:var(--jade-50);color:var(--jade);font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;border:1px solid var(--jade-100)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;border-radius:14px;background:var(--jade);color:#fff;font-weight:650;font-size:15px;transition:background .15s,transform .1s;width:100%}
.btn:hover{background:var(--jade-700)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.sec{background:var(--jade-50);color:var(--jade)}
.btn.sec:hover{background:var(--jade-100)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line-2)}
.btn.danger{background:var(--red)}
.btn.small{min-height:36px;padding:7px 14px;font-size:13.5px;border-radius:11px;width:auto}
.link{color:var(--jade);font-weight:600;font-size:14px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* inputs */
.field{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 14px;min-height:50px;transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:var(--jade);box-shadow:0 0 0 3px rgba(0,101,100,.12)}
.field input{flex:1;border:0;outline:0;background:none;font-size:15px;min-width:0;padding:12px 0}
.field svg{color:var(--muted)}
.label{font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px;display:block}
textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);font-size:14.5px;line-height:1.5;outline:none;resize:vertical;min-height:110px}
textarea:focus{border-color:var(--jade);box-shadow:0 0 0 3px rgba(0,101,100,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:550;color:var(--ink-2)}
.chip:hover{border-color:var(--jade-200);color:var(--jade)}

/* list rows */
.rows{display:flex;flex-direction:column}
.rowi{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line-2);width:100%}
.rowi:first-child{border-top:0}
button.rowi:hover{background:#FAFBFB}
.rowi .ttl{font-weight:600;font-size:15px}
.rowi .chev{color:#A8B3B0}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--line-2);color:var(--muted);flex-shrink:0}
.num.done{background:var(--jade);color:#fff}
.num.now{background:var(--surface);color:var(--jade);box-shadow:inset 0 0 0 2px var(--jade)}
.ico-tile{width:40px;height:40px;border-radius:12px;background:var(--jade-50);color:var(--jade);display:grid;place-items:center;flex-shrink:0}

.progress{height:6px;border-radius:99px;background:var(--line-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--jade);border-radius:99px;transition:width .4s}
.pass .progress{background:rgba(255,255,255,.18)}
.pass .progress i{background:#fff}

/* timeline */
.tl{display:flex;flex-direction:column}
.tl .st{display:flex;gap:14px;position:relative;padding-bottom:18px}
.tl .st:last-child{padding-bottom:0}
.tl .st::before{content:"";position:absolute;left:11px;top:26px;bottom:2px;width:2px;background:var(--line)}
.tl .st.done::before{background:var(--jade)}
.tl .st:last-child::before{display:none}
.tl .node{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);color:#fff;z-index:1}
.tl .done .node{background:var(--jade);border-color:var(--jade)}
.tl .now .node{border-color:var(--jade);box-shadow:0 0 0 5px rgba(0,101,100,.12)}
.tl .now .node::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--jade);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.tl .nm{font-weight:600;font-size:14.5px;line-height:1.3}
.tl .todo .nm{color:var(--muted);font-weight:550}
.tl .sb{font-size:12.5px;color:var(--muted);margin-top:2px}
.tl .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto;padding-left:8px;white-space:nowrap}

/* bullets */
.ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.ul li{display:flex;gap:10px;font-size:14.5px;line-height:1.45}
.ul li svg{color:var(--jade);margin-top:2px}
.redact{background:#F7F9F9;border:1px dashed #C9D4D2;border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.redact mark{background:#E2EEEC;color:var(--jade);padding:0 5px;border-radius:5px;font-weight:600;font-size:12px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45}
.note svg{margin-top:1px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.kpi b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.kpi span{font-size:12.5px;color:var(--muted)}

/* switch */
.sw{width:46px;height:28px;border-radius:99px;background:#CDD6D4;position:relative;transition:.2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.sw.on{background:var(--jade)}
.sw.on::after{left:21px}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:86%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.45}
.bub.me{align-self:flex-end;background:var(--jade);color:#fff;border-bottom-right-radius:6px}
.bub.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub.human{align-self:flex-start;background:var(--amber-bg);border:1px solid var(--amber-line);border-bottom-left-radius:6px}
.bub .who{font-size:11.5px;font-weight:650;color:var(--muted);margin-bottom:3px}
.composer{display:flex;gap:8px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line-2);flex-shrink:0}
.composer input{flex:1;border:1px solid var(--line);border-radius:99px;padding:11px 16px;outline:none;font-size:14.5px;background:var(--bg)}
.composer input:focus{border-color:var(--jade)}
.sendbtn{width:44px;height:44px;border-radius:50%;background:var(--jade);color:#fff;display:grid;place-items:center;flex-shrink:0}

/* tabbar */
.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line-2);padding:6px 6px calc(8px + env(safe-area-inset-bottom));flex-shrink:0;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:#8C9894;font-size:11.5px;font-weight:600;position:relative;border-radius:12px;text-align:center}
.tab.on{color:var(--jade)}
.tab .badge{position:absolute;top:4px;left:calc(50% + 7px);width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(10,25,24,.42);z-index:40;display:flex;align-items:flex-end;animation:fade .18s ease}
.sheet{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:88%;overflow-y:auto;animation:up .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:38px;height:5px;border-radius:99px;background:#D5DDDB;margin:0 auto 14px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.opt{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);flex:1;min-width:0}
.opt.on{border-color:var(--jade);background:var(--jade-50)}
.opt b{font-size:14.5px}

/* toast */
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:60;background:#13201F;color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:drop .25s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{from{transform:translateY(12px);opacity:0}}
.kvr{display:flex;justify-content:space-between;gap:16px;font-size:13.5px}
.kvr b{text-align:right;font-weight:600}

/* sign-in */
.welcome{flex:1;overflow-y:auto;display:flex;flex-direction:column;background:var(--surface)}
.hero{background:linear-gradient(160deg,#007774 0%,#006564 40%,#003F3E 100%);color:#fff;padding:calc(26px + env(safe-area-inset-top)) 24px 54px;position:relative;overflow:hidden}
.hero svg.arc{position:absolute;right:-40px;bottom:-30px;opacity:.13}
.hero .mark{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22)}
.hero h1{font-size:30px;font-weight:700;letter-spacing:-.03em;margin-top:28px;line-height:1.1}
.hero p{font-size:15px;opacity:.85;margin-top:8px;max-width:290px}
.signin{background:var(--surface);border-radius:26px 26px 0 0;margin-top:-26px;position:relative;padding:26px 22px 20px;display:flex;flex-direction:column;gap:14px;flex:1}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--red);font-size:13px;display:flex;gap:6px;align-items:center}
.foot{font-size:11.5px;color:var(--muted);text-align:center;margin-top:auto;padding-top:12px;line-height:1.5}

.bars{display:flex;align-items:flex-end;gap:3px;height:92px;margin-top:12px}
.bars i{flex:1;background:var(--jade-100);border-radius:3px 3px 0 0;min-height:2px}
.bars i.hi{background:var(--jade)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 0;border-bottom:1px solid var(--line-2);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.empty{text-align:center;padding:28px 18px;color:var(--muted)}
.empty .ico-tile{margin:0 auto 12px;width:52px;height:52px;border-radius:16px}
.fade-in{animation:fade .2s ease}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <header class="top" id="top" style="display:none"></header>
    <main class="screen" id="screen"></main>
    <div id="composer"></div>
    <nav class="tabs" id="tabs" style="display:none"></nav>
    <div id="layer"></div>
    <div id="toast" aria-live="polite"></div>
  </div>
</div>

<script>
"use strict";

/* ================= icons ================= */
const P = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  route:'<circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H17a3.5 3.5 0 0 0 0-7H7a3.5 3.5 0 0 1 0-7h8.5"/>',
  chat:'<path d="M21 12a8.5 8.5 0 0 1-12.3 7.6L3.5 21l1.4-5A8.5 8.5 0 1 1 21 12z"/>',
  shield:'<path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6z"/><path d="m9 12 2 2 4-4"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  heart:'<path d="M12 20.5s-8-4.6-8-10.6A4.4 4.4 0 0 1 12 7.3a4.4 4.4 0 0 1 8 2.6c0 6-8 10.6-8 10.6z"/>',
  badge:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2"/><path d="M5.8 16c.6-1.4 1.7-2 3.2-2s2.6.6 3.2 2M14.5 10h4M14.5 13.5h3"/>',
  plane:'<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15v2M11 10v7M15 12v5M19 6v11"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  chevR:'<path d="m9 18 6-6-6-6"/>',
  chevL:'<path d="m15 18-6-6 6-6"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>',

const $ = (q) => document.querySelector(q);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (m) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const marks = (s) => esc(s).replace(/\[(name|age|phone|email|ID number|document number|condition)\]/g, "<mark>$1</mark>");

function toast(msg, icon = "check") {
  const t = $("#toast");
  t.innerHTML = `<div class="toast">${ic(icon, 18)}<span>${esc(msg)}</span></div>`;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (t.innerHTML = ""), 2800);
}

/* ================= api ================= */
async function fetchState(silent) {
  try {
    const r = await fetch(`/api/journey/state?role=${encodeURIComponent(S.role)}&persona=${encodeURIComponent(S.persona)}`, { cache:"no-store" });
    if (!r.ok) return;
    const txt = await r.text();
    if (silent && txt === LASTJSON) return;
    const prev = STATE;
    STATE = JSON.parse(txt);
    LASTJSON = txt;
    if (silent) {
      notifyChanges(prev, STATE);
      const a = document.activeElement;
      if (a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT")) return;
    }
    render(!!silent);
  } catch {}
}
function notifyChanges(a, b) {
  if (!a || !b) return;
  if (S.role === "carer" && b.updates && b.updates[0] && (!a.updates || !a.updates[0] || a.updates[0].text !== b.updates[0].text)) toast(b.updates[0].text, "bell");
  if (S.role === "staff" && b.travel && b.travel.helpRequested && !b.travel.helpAcked && !(a.travel && a.travel.helpRequested)) toast("Help requested by the passenger", "alert");
  if (S.role === "crew" && b.travel && b.travel.crewHelpRequested && !b.travel.crewHelpAcked && !(a.travel && a.travel.crewHelpRequested)) toast(`Discreet help request · seat ${b.booking.seat}`, "bell");
  if (S.role === "passenger" && b.travel && a.travel) {
    if (b.travel.stage > a.travel.stage) toast("Handover confirmed by staff", "check");
    if (b.travel.helpAcked && !a.travel.helpAcked) toast("Help is on the way", "hand");
  }
}
async function act(type, payload = {}, okMsg) {
  if (BUSY) return;
  BUSY = type; render(true);
  try {
    const r = await fetch("/api/journey/action", { method:"POST", headers:{ "content-type":"application/json" }, body:JSON.stringify({ role:S.role, persona:S.persona, type, ...payload }) });
    if (r.ok) { const txt = await r.text(); STATE = JSON.parse(txt); LASTJSON = txt; if (okMsg) toast(okMsg); }
    else toast(r.status === 429 ? "Too many requests, try again in a second" : "Something went wrong. Please try again.", "alert");
  } catch { toast("You appear to be offline", "alert"); }
  finally { BUSY = null; render(true); }
}
async function loadFlights() {
  FLIGHTS = null;
  try { const r = await fetch("/api/flights", { cache:"no-store" }); FLIGHTS = r.ok ? await r.json() : { error:true }; }
  catch { FLIGHTS = { error:true }; }
  render(true);
}

/* ================= session ================= */
function enter(role, persona) {
  S.in = true; S.role = role; S.persona = persona || S.pick; S.tab = TABS[role][0][0]; S.sub = null; S.sheet = null; S.err = "";
  STATE = null; LASTJSON = "";
  render();
  fetchState();
  if (role === "manager") loadFlights();
  clearInterval(POLL);
  POLL = setInterval(() => { if (!BUSY && !document.hidden) fetchState(true); }, 4000);
}
function signOut() { clearInterval(POLL); S.in = false; S.sheet = null; STATE = null; render(); }
function signInForm(e) {
  e.preventDefault();
  const email = $("#em").value.trim().toLowerCase(), pw = $("#pw").value;
  const u = DEMO_USERS[email];
  if (!email || !pw) { S.err = "Enter your email and password."; return render(); }
  if (!u || pw !== DEMO_PW) { S.err = "Email or password not recognised."; return render(); }
  enter(u[0], u[1] || S.pick);
}

function abtn(type, label, cls = "", attrs = "") {
  const busy = BUSY === type;
  return `<button class="btn ${cls}" data-a="${type}" ${attrs} ${BUSY ? "disabled" : ""}>${busy ? `<span class="spin"></span>Working…` : label}</button>`;
}
function srcTag(src) {
  return src === "ai" ? `<span class="pill jade">${ic("spark", 13, 2)}AI suggestion</span>` : src ? `<span class="pill">Built-in rules</span>` : "";
}
function statusPill(st, okText = "Approved") {
  if (st === "approved" || st === "verified") return `<span class="pill ok">${ic("check", 13, 2.4)}${okText}</span>`;
  if (st === "draft") return `<span class="pill amber"><span class="dot"></span>Review needed</span>`;
  if (st === "withheld") return `<span class="pill">Safety info only</span>`;
  return `<span class="pill">Not started</span>`;
}
function boardingPass(per, b, extra = "") {
  const aps = String(per.route || "").split("→").map((x) => x.trim()).filter(Boolean);
  const legs = aps.map((a, i) => `${i ? `<div class="leg"><i></i>${i === aps.length - 1 || aps.length === 2 ? ic("plane", 16) : ""}<i></i></div>` : ""}<div ${i === aps.length - 1 && i ? 'style="text-align:right"' : i ? 'style="text-align:center"' : ""}><div class="ap">${esc(a)}</div><div class="city">${esc(CITY[a] || "")}</div></div>`).join("");
  return `
    <div class="pass">
      <div class="row between"><span class="pill glass">${ic("plane", 13)}${esc(b && b.flight || per.flight)}</span>${extra}</div>
      <div class="route">${legs}</div>
      <div class="meta">
        <div><span>Passenger</span><b>${esc(per.passenger)}</b></div>
        <div><span>Seat</span><b>${esc(String((b && b.seat) || per.seat).replace(/\s*\(.*\)/, ""))}</b></div>
        <div><span>Booking</span><b>${esc((b && b.ref) || "—")}</b></div>
      </div>
    </div>`;
}
function timeline(stages, cur, opts = {}) {
  return `<div class="tl">${stages.map((s, i) => {
    const cls = i < cur ? "done" : i === cur ? "now" : "todo";
    return `<div class="st ${cls}"><div class="node">${i < cur ? ic("check", 13, 3) : ""}</div>
      <div class="grow"><div class="row" style="align-items:flex-start"><div class="nm grow">${esc(s.name)}</div>${s.time && !opts.noTime ? `<div class="tm">${esc(s.time)}</div>` : ""}</div>
      <div class="sb">${esc(opts.owner ? s.owner : [s.where, s.owner && `${s.owner}${s.role ? " · " + s.role : ""}`].filter(Boolean).join(" · "))}</div></div></div>`;
  }).join("")}</div>`;
}
function swapBanner(sw) {
  if (!sw) return "";
  return sw.status === "approved"
    ? `<div class="card tint flat note">${ic("check", 18)}<div><b>Aircraft changed${sw.newAircraft ? ` to ${esc(sw.newAircraft)}` : ""}.</b> Your assistance plan was re-checked and approved. Bulkhead seat kept.</div></div>`
    : `<div class="card warn note">${ic("swap", 18)}<div><b>Aircraft change detected.</b> We're re-checking your seat and assistance. No action needed.</div></div>`;

      d:b.booked ? `Added to booking ${b.ref}` : p.status === "none" ? "After your needs are matched" : "Ready to add" },
    { id:"brief", t:"Approve your crew brief", done:approved,
      d:approved ? `Approved · version ${pl.version}` : pl.confirmed ? "Review what crew will see" : "After booking" }
  ];
}

    </div>
    <div class="card">
      <div class="row between"><div class="h3">By hour</div><span class="xs muted">${esc(F.date)}</span></div>
      <div class="bars">${h.map((v, i) => `<i class="${i === peak ? "hi" : ""}" style="height:${(v / max) * 100}%" title="${String(i).padStart(2, "0")}:00 · ${v}"></i>`).join("")}</div>
      <div class="axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>
      <div class="xs muted mt8">Peak at ${String(peak).padStart(2, "0")}:00 with ${h[peak] || 0} departures</div>
    </div>
    ${(F.london || []).length ? `<div class="card"><div class="h3">London departures</div>
      <table class="tbl mt8"><tr><th>Time</th><th>Flight</th><th>Gate</th><th>Status</th></tr>
      ${F.london.slice(0, 8).map((f) => `<tr><td>${esc(f.time)}</td><td><b>${esc(f.flight)}</b></td><td>${esc(f.gate || "—")}</td><td class="muted">${esc(f.status)}</td></tr>`).join("")}</table></div>` : ""}
    <div class="xs muted" style="padding:0 4px">Source: ${esc(F.source)}</div>`;
}

/* ================= shell ================= */
const SUBTITLES = { needs:"Travel needs", booking:"Booking", brief:"Crew brief" };
function renderTop() {
  const top = $("#top");
  if (!S.in) { top.style.display = "none"; return; }
  top.style.display = "flex";
  const r = ROLES[S.role], name = whoAmI();
  if (S.sub) {
    top.innerHTML = `<button class="iconbtn" data-a="back" aria-label="Back">${ic("chevL", 22, 2)}</button><div class="grow t1">${SUBTITLES[S.sub] || ""}</div><span style="width:36px"></span>`;
    return;
  }
  top.innerHTML = `
    <div class="mark">${logo(18)}</div>
    <div class="grow"><div class="t1">Smooth Journey</div><div class="t2">${r.label}${STATE ? ` · ${esc(STATE.persona.flight)}` : ""}</div></div>
    <button class="avatar" data-a="account" aria-label="Account">${initials(name)}</button>`;
}
function renderTabs() {
  const el = $("#tabs");
  if (!S.in || S.sub) { el.style.display = "none"; return; }
  el.style.display = "flex";
  const t = STATE && STATE.travel;
  const badge = (id) => !t ? false :
    (S.role === "staff" && id === "passenger" && t.helpRequested && !t.helpAcked) ||
    (S.role === "crew" && id === "cabin" && t.crewHelpRequested && !t.crewHelpAcked) ||
    (S.role === "passenger" && id === "home" && STATE.plan && STATE.plan.brief.status === "draft");
  el.innerHTML = TABS[S.role].map(([id, icon, label]) => `
    <button class="tab ${S.tab === id ? "on" : ""}" data-a="tab" data-v="${id}" aria-current="${S.tab === id}">
      ${ic(icon, 22, S.tab === id ? 2.1 : 1.7)}<span>${label}</span>${badge(id) ? `<span class="badge"></span>` : ""}
    </button>`).join("");
}
function body() {
  const s = STATE;
  if (S.role === "passenger") {
    if (S.sub === "needs") return pNeeds();
    if (S.sub === "booking") return pBooking();
    if (S.sub === "brief") return pBrief();
    return { home:pHome, journey:pJourney, ask:pAsk, privacy:pPrivacy }[S.tab]();
  }
  if (S.role === "carer") return s.paused ? cPaused() : S.tab === "updates" ? cUpdates() : cLive();
  if (S.role === "staff") return S.tab === "handover" ? sHandover() : sPassenger();
  if (S.role === "crew") return S.tab === "cabin" ? crCabin() : crBrief();
  return { ops:mOps, disruption:mDisruption, airport:mAirport }[S.tab]();
}
function renderLayer() {
  const L = $("#layer");
  if (!S.sheet) { L.innerHTML = ""; return; }
  const inner = S.sheet === "demo" ? sheetDemo() : S.sheet === "qr" ? sheetQR() : sheetAccount();
  L.innerHTML = `<div class="scrim" data-a="close-bg"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${inner}</div></div>`;
}
function render(keep) {
  const sc = $("#screen");
  const y = sc.scrollTop;
  renderTop(); renderTabs(); renderLayer();
  if (!S.in) {
    sc.style.padding = "0"; sc.innerHTML = viewWelcome(); $("#composer").innerHTML = "";
    return;
  }
  sc.style.padding = "";
  if (!STATE) { sc.innerHTML = `<div class="card empty" style="margin-top:60px"><span class="spin" style="display:inline-block;color:var(--jade)"></span><div class="sm mt8">Loading your journey…</div></div>`; return; }
  sc.innerHTML = body();
  $("#composer").innerHTML = S.role === "passenger" && S.tab === "ask" && !S.sub ? composer() : "";
  if (keep) sc.scrollTop = y;
  else sc.scrollTop = 0;
  if (S.role === "passenger" && S.tab === "ask" && !keep) sc.scrollTop = sc.scrollHeight;
  if (S.role === "passenger" && S.tab === "ask" && keep && BUSY === null) sc.scrollTop = sc.scrollHeight;
}

/* ================= events ================= */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  if (a === "close-bg") { if (e.target === el) { S.sheet = null; renderLayer(); } return; }
  switch (a) {
    case "demo": S.sheet = "demo"; renderLayer(); break;
    case "qr": S.sheet = "qr"; renderLayer(); break;
    case "account": S.sheet = "account"; renderLayer(); break;
    case "copy": navigator.clipboard && navigator.clipboard.writeText(location.href.split("#")[0]); toast("Link copied"); break;
    case "pick": S.pick = v; renderLayer(); break;
    case "enter": enter(v, S.pick); break;
    case "signout": signOut(); break;
    case "reset": S.sheet = null; renderLayer(); S.sub = null; act("reset", {}, "Demo journey reset"); break;
    case "tab": S.tab = v; S.sub = null; render(); break;
    case "sub": S.sub = v; render(); break;
    case "back": S.sub = null; render(); break;
    case "flights": loadFlights(); break;
    case "example": $("#rawNeeds").value = STATE.persona.defaultText; break;
    case "oxygen": { const t = $("#rawNeeds"); if (!/oxygen/i.test(t.value)) t.value = t.value.trim() + " Also needs oxygen on board."; break; }
    case "askq": act("ask", { question:v }); break;
    case "consent": act("consent", { key:v }); break;
    case "removeCode": act("removeCode", { index:Number(v) }); break;
    case "matchProfile": act("matchProfile", { text:$("#rawNeeds").value }, "Needs matched"); break;
    case "saveProfile": act("saveProfile", {}, "Saved to your profile"); break;
    case "applyAndBook": act("applyAndBook", {}, "Added to your booking"); break;
    case "approveBriefAndCard": act("approveBriefAndCard", { briefText:$("#briefEdit").value }, "Approved and shared"); break;
    case "changePlan": act("changePlan", { note:"Quiet room before boarding" }, "Quiet room requested"); break;
    case "deleteProfile": if (confirmDelete()) act("deleteProfile", {}, "Travel needs deleted"); break;
    case "startTravel": act("startTravel", {}, "Have a smooth journey"); break;
    case "requestHelp": act("requestHelp"); break;
    case "ackHelp": act("ackHelp", {}, "Passenger notified"); break;
    case "confirmCodes": act("confirmCodes", {}, "Codes confirmed"); break;
    case "completeHandover": act("completeHandover", {}, "Handover confirmed"); break;
    case "ackCrewHelp": act("ackCrewHelp", {}, "Acknowledged"); break;
    case "handoverArrival": act("handoverArrival", {}, "Handed over to arrival team"); break;
    case "simulateSwap": act("simulateSwap"); break;
    case "approveSwap": act("approveSwap", {}, "New plan approved"); break;
  }
});
function confirmDelete() {
  // Inline two-tap confirm avoids blocking browser dialogs
  if (confirmDelete.armed) { confirmDelete.armed = false; return true; }
  confirmDelete.armed = true; toast("Tap again to delete", "trash");
  setTimeout(() => (confirmDelete.armed = false), 3000);
  return false;
}
document.addEventListener("submit", (e) => {
  if (e.target.id === "signinForm") return signInForm(e);
  if (e.target.id === "askForm") {
    e.preventDefault();
    const q = $("#askQ").value.trim();
    if (q) act("ask", { question:q });
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.sheet) { S.sheet = null; renderLayer(); } });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
render();
</script>
</body>
</html>
