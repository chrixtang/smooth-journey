<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smooth Journey</title>
<meta name="description" content="Joined-up travel assistance from booking to arrival. Student concept prototype.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#006564">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --jade:#006564; --teal:#367A74; --jade-700:#00514F;
  --jade-50:#EDF3F2; --jade-100:#D9E6E4; --jade-200:#B5CFCB;
  --cta:#2F3D36; --cta-h:#24302A;
  --bg:#F6F5F2; --surface:#FFFFFF; --line:#E9E7E2; --line-2:#F0EFEB;
  --ink:#2A2B2A; --ink-2:#4E524F; --muted:#80837F;
  --gold:#8A6D33; --gold-bg:#F7F1E4;
  --amber:#8F5F00; --amber-bg:#FBF3E2; --amber-line:#EED9AE;
  --red:#A93226; --red-bg:#FBEDEB; --red-line:#F0C6C0;
  --ok:#2F7A55; --ok-bg:#EAF4EE;
  --r:14px;
  --sh:0 1px 3px rgba(40,40,30,.05),0 6px 18px rgba(40,40,30,.05);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#E3E6E4;color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;font-size:15px;font-weight:400}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:inherit}
svg.i{flex-shrink:0;display:block}
b,strong{font-weight:500}

/* ---------- device frame ---------- */
.stage{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;isolation:isolate;overflow:hidden}
.stage::before{content:"";position:fixed;inset:-30px;z-index:-1;background:linear-gradient(rgba(235,241,241,.45),rgba(235,241,241,.6)),url(/hero.jpg) center/cover;filter:blur(8px)}
.phone{width:100%;max-width:410px;height:min(880px,calc(100dvh - 48px));background:var(--bg);border-radius:46px;box-shadow:0 0 0 9px #fff,0 0 0 10px #DAD8D2,0 40px 80px rgba(30,50,45,.18);display:flex;flex-direction:column;overflow:hidden;position:relative;isolation:isolate}
@media(max-width:520px){.stage{padding:0;background:var(--bg)}.phone{max-width:100%;height:100dvh;border-radius:0;box-shadow:none}}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:10px;padding:12px 18px 10px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--bg);flex-shrink:0;z-index:5;min-height:58px}
.top.plain{background:var(--surface);border-bottom:1px solid var(--line-2)}
.top .t1{font-weight:500;font-size:16px;letter-spacing:-.005em;line-height:1.2}
.top .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grow{flex:1;min-width:0}
.rolesel{display:inline-flex;align-items:center;gap:4px;position:relative;cursor:pointer;color:var(--ink)}
.rolesel span{font-size:14px;font-weight:500}
.rolesel select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;font-size:16px}
.rolesel svg{transform:rotate(90deg);color:var(--teal);pointer-events:none}
.rolesel:focus-within{color:var(--teal)}
.mark{width:30px;height:30px;border-radius:50%;background:var(--jade);display:grid;place-items:center;flex-shrink:0}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--surface);color:var(--teal);font-weight:500;font-size:13px;display:grid;place-items:center;border:1px solid var(--line)}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:active{background:var(--line-2)}

/* ---------- screen ---------- */
.screen{flex:1;overflow-y:auto;padding:8px 18px 28px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{width:0}
.screen>*{flex-shrink:0}
.h1{font-size:27px;font-weight:400;letter-spacing:-.015em;line-height:1.15}
.h2{font-size:20px;font-weight:400;letter-spacing:-.01em}
.h3{font-size:16.5px;font-weight:500}
.eyebrow{font-size:13px;font-weight:400;color:var(--muted)}
.muted{color:var(--muted)} .sm{font-size:14px} .xs{font-size:12.5px}
.ink2{color:var(--ink-2)}
.teal{color:var(--teal)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column}
.gap4{gap:4px}.gap8{gap:8px}.gap12{gap:12px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.grow{flex:1;min-width:0}

.card{background:var(--surface);border:0;border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.card.tint{background:var(--jade-50);box-shadow:none}
.card.warn{background:var(--amber-bg);box-shadow:none}
.card.alert{background:var(--red-bg);box-shadow:none}
.card.pad0{padding:0;overflow:hidden}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;padding:6px 2px 0}
.sec-title .h2{font-size:21px}
.link{color:var(--teal);font-weight:400;font-size:15px}

/* flight card (Cathay "Upcoming journey" style) */
.flight{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.flight .in{padding:18px 18px 16px}
.flight .date{font-size:14.5px;color:var(--ink-2)}
.flight .date i{display:inline-block;width:1px;height:13px;background:var(--line);margin:0 8px;vertical-align:-1px}
.flight .cities{font-size:19px;font-weight:500;margin-top:4px}
.flight .cities span{color:var(--teal)}
.flight .cities em{font-style:normal;font-weight:400;color:var(--ink)}
.flight .legs{display:flex;align-items:flex-end;gap:12px;margin-top:14px}
.flight .ap{font-size:19px;font-weight:500;color:var(--teal);letter-spacing:.01em}
.flight .tm{font-size:21px;font-weight:400;margin-top:1px}
.flight .tx{font-size:12.5px;color:var(--muted)}
.flight .line{flex:1;display:flex;align-items:center;gap:6px;padding-bottom:28px;color:var(--ink)}
.flight .line i{flex:1;height:2px;background:var(--line);border-radius:2px;position:relative}
.flight .line i::after{content:"";position:absolute;right:-2px;top:-3px;width:8px;height:8px;border-radius:50%;background:#C9C7C1}
.flight .line svg{transform:rotate(45deg)}
.flight .dur{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:-2px}
.flight .bar{display:flex;align-items:center;gap:12px;background:var(--cta);color:#fff;padding:15px 18px;font-size:15px;width:100%}
.flight .bar:hover{background:var(--cta-h)}
.flight .bar.ok{background:var(--jade-50);color:var(--teal)}

/* status card (membership-card style) */
.pass{border-radius:18px;color:#fff;background:linear-gradient(160deg,#5E9A92 0%,#3C7A73 45%,#245A55 100%);padding:18px;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(30,80,75,.22);min-height:168px}
.pass>*{position:relative;z-index:1}
.pass>.scene{position:absolute;inset:0;z-index:0;pointer-events:none}
.pass .h2{text-shadow:0 1px 8px rgba(0,40,38,.25)}
.pass .progress{background:rgba(255,255,255,.22)}
.pass .progress i{background:#fff}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:400;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill.jade{background:var(--jade-50);color:var(--teal)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.glass{background:rgba(255,255,255,.18);color:#fff}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.code{display:inline-flex;align-items:center;justify-content:center;min-width:54px;padding:4px 8px;border-radius:8px;background:var(--jade-50);color:var(--teal);font:500 12.5px "Outfit",ui-monospace,monospace;letter-spacing:.05em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 18px;border-radius:10px;background:var(--cta);color:#fff;font-weight:400;font-size:16px;transition:background .15s,transform .1s;width:100%}
.btn:hover{background:var(--cta-h)}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.sec{background:var(--jade-50);color:var(--teal)}
.btn.sec:hover{background:var(--jade-100)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line-2)}
.btn.danger{background:var(--red)}
.btn.jade{background:var(--jade)}
.btn.small{min-height:36px;padding:7px 14px;font-size:14px;width:auto}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* inputs */
.field{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 14px;min-height:52px;transition:border-color .15s,box-shadow .15s;position:relative}
.field:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px rgba(54,122,116,.12)}
.field input,.field select{flex:1;border:0;outline:0;background:none;font-size:16px;min-width:0;padding:13px 0;-webkit-appearance:none;appearance:none}
.field select{cursor:pointer;padding-right:24px}
.field .caret{position:absolute;right:14px;pointer-events:none;color:var(--muted);transform:rotate(90deg)}
.field svg{color:var(--muted)}
.label{font-size:13.5px;font-weight:400;color:var(--muted);margin-bottom:6px;display:block}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);font-size:15px;line-height:1.5;outline:none;resize:vertical;min-height:110px}
textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(54,122,116,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;color:var(--ink-2)}
.chip:hover{border-color:var(--jade-200);color:var(--teal)}

/* list rows */
.rows{display:flex;flex-direction:column}
.rowi{display:flex;align-items:center;gap:14px;padding:15px 18px;border-top:1px solid var(--line-2);width:100%}
.rowi:first-child{border-top:0}
button.rowi:hover{background:#FBFAF8}
.rowi .ttl{font-weight:400;font-size:16px}
.rowi .chev{color:#A9ABA6}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:400;font-size:13.5px;border:1px solid var(--line);color:var(--muted);flex-shrink:0}
.num.done{background:var(--teal);border-color:var(--teal);color:#fff}
.num.now{border:1.5px solid var(--teal);color:var(--teal)}
.ico-tile{width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--teal);display:grid;place-items:center;flex-shrink:0}

.progress{height:6px;border-radius:99px;background:var(--line-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .4s}

/* timeline */
.tl{display:flex;flex-direction:column}
.tl .st{display:flex;gap:14px;position:relative;padding-bottom:18px}
.tl .st:last-child{padding-bottom:0}
.tl .st::before{content:"";position:absolute;left:10px;top:24px;bottom:2px;width:2px;background:var(--line)}
.tl .st.done::before{background:var(--teal)}
.tl .st:last-child::before{display:none}
.tl .node{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:var(--surface);border:2px solid #D9D7D1;color:#fff;z-index:1}
.tl .done .node{background:var(--teal);border-color:var(--teal)}
.tl .now .node{border-color:var(--teal);box-shadow:0 0 0 5px rgba(54,122,116,.12)}
.tl .now .node::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.tl .nm{font-weight:500;font-size:15px;line-height:1.3}
.tl .todo .nm{color:var(--muted);font-weight:400}
.tl .sb{font-size:13px;color:var(--muted);margin-top:2px}
.tl .tm{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto;padding-left:8px;white-space:nowrap}

/* bullets */
.ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.ul li{display:flex;gap:10px;font-size:15px;line-height:1.45}
.ul li svg{color:var(--teal);margin-top:2px}
.redact{background:var(--bg);border:1px dashed #D3D1CA;border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink-2);line-height:1.5}
.redact mark{background:var(--jade-50);color:var(--teal);padding:0 6px;border-radius:5px;font-size:12.5px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}
.note svg{margin-top:1px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.kpi{background:var(--surface);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh)}
.kpi b{display:block;font-size:26px;font-weight:400;letter-spacing:-.02em;margin-top:2px}
.kpi span{font-size:13px;color:var(--gold)}
.kvr{display:flex;justify-content:space-between;gap:16px;font-size:14px}
.kvr b{text-align:right;font-weight:500}

/* switch */
.sw{width:46px;height:28px;border-radius:99px;background:#D3D2CC;position:relative;transition:.2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.sw.on{background:var(--teal)}
.sw.on::after{left:21px}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:86%;padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.45}
.bub.me{align-self:flex-end;background:var(--cta);color:#fff;border-bottom-right-radius:5px}
.bub.ai{align-self:flex-start;background:var(--surface);box-shadow:var(--sh);border-bottom-left-radius:5px}
.bub.human{align-self:flex-start;background:var(--gold-bg);border-bottom-left-radius:5px}
.bub .who{font-size:12.5px;color:var(--gold);margin-bottom:3px}
.composer{display:flex;gap:8px;padding:10px 14px;background:var(--bg);border-top:1px solid var(--line);flex-shrink:0}
.composer input{flex:1;border:1px solid var(--line);border-radius:99px;padding:12px 16px;outline:none;font-size:15px;background:var(--surface)}
.composer input:focus{border-color:var(--teal)}
.sendbtn{width:46px;height:46px;border-radius:50%;background:var(--cta);color:#fff;display:grid;place-items:center;flex-shrink:0}

/* tabbar */
.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));flex-shrink:0;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px;color:#737671;font-size:12.5px;position:relative;text-align:center}
.tab.on{color:var(--teal);font-weight:500}
.tab .badge{position:absolute;top:2px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}

/* greeting band (Cathay profile header style) */
.band{margin:-8px -18px 0;padding:22px 18px 70px;position:relative;overflow:hidden;background:linear-gradient(180deg,#C9DDD9 0%,#DCE8E5 55%,#EEF3F1 100%)}
.band>*{position:relative;z-index:1}
.band>.scene{position:absolute;inset:0;z-index:0;pointer-events:none}
.band .hello{font-size:28px;font-weight:300;letter-spacing:-.01em;line-height:1.15}
.band .sub{font-size:14px;color:var(--ink-2);margin-top:6px;display:flex;align-items:center;gap:8px}
.lift{margin-top:-52px;position:relative;z-index:2}


/* photo hero with Cathay logo */
.hero2{margin:-8px -18px 0;height:178px;position:relative;background:#cfe0e8 url(/hero.jpg) 50% 72%/cover no-repeat;flex-shrink:0}
.hero2::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 35%,rgba(0,35,40,0) 55%,rgba(0,35,40,.55) 100%)}
.hero2>*{position:absolute;z-index:1}
.hero2 .cx{top:16px;left:18px;height:46px;width:auto}
.hero2 .ht{left:18px;bottom:14px;color:#fff;font-size:30px;font-weight:300;letter-spacing:-.01em;text-shadow:0 1px 10px rgba(0,30,35,.35)}
.hero2.big{height:300px;background-position:50% 64%}
.hero2.big::after{background:linear-gradient(180deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 40%,rgba(0,35,40,0) 60%,rgba(0,35,40,.35) 100%)}
.hero2 .hi{left:18px;top:74px}
.hero2 .hello{font-size:30px;font-weight:300;letter-spacing:-.01em;color:var(--ink);line-height:1.1}
.hero2 .hsub{font-size:13.5px;color:var(--ink-2);margin-top:4px}
.lift2{margin-top:-74px;position:relative;z-index:2}
.ctl{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:20;display:flex;gap:8px;align-items:center}
.glass{height:36px;padding:0 13px;border-radius:99px;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 2px 12px rgba(0,30,35,.12);display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:500;color:var(--ink)}
.glass.round{width:36px;padding:0;justify-content:center}
.cx-mini{height:30px;width:auto}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(25,30,28,.4);z-index:40;display:flex;align-items:flex-end;animation:fade .18s ease}
.sheet{background:var(--surface);width:100%;border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));max-height:88%;overflow-y:auto;animation:up .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:38px;height:5px;border-radius:99px;background:#DEDCD6;margin:0 auto 16px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}

/* toast */
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:60;background:var(--cta);color:#fff;border-radius:12px;padding:13px 15px;font-size:14.5px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.2);animation:drop .25s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{from{transform:translateY(12px);opacity:0}}


.bars{display:flex;align-items:flex-end;gap:3px;height:92px;margin-top:12px}
.bars i{flex:1;background:var(--jade-100);border-radius:3px 3px 0 0;min-height:2px}
.bars i.hi{background:var(--teal)}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:400;color:var(--muted);font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 0;border-bottom:1px solid var(--line-2);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.empty{text-align:center;padding:28px 18px;color:var(--muted)}
.empty .ico-tile{margin:0 auto 12px;width:54px;height:54px}
.fade-in{animation:fade .2s ease}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <header class="ctl" id="top"></header>
    <main class="screen" id="screen"></main>
    <div id="composer"></div>
    <nav class="tabs" id="tabs" style="display:none"></nav>
    <div id="layer"></div>
    <div id="toast" aria-live="polite"></div>
  </div>
</div>

<script>
"use strict";

/* ================= icons ================= */
const P = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  route:'<circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H17a3.5 3.5 0 0 0 0-7H7a3.5 3.5 0 0 1 0-7h8.5"/>',

const $ = (q) => document.querySelector(q);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (m) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const marks = (s) => esc(s).replace(/\[(name|age|phone|email|ID number|document number|condition)\]/g, "<mark>$1</mark>");

function toast(msg, icon = "check") {
  const t = $("#toast");
  t.innerHTML = `<div class="toast">${ic(icon, 18)}<span>${esc(msg)}</span></div>`;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (t.innerHTML = ""), 2600);
}

/* ================= api ================= */
async function fetchState(silent) {
  try {
    const r = await fetch(`/api/journey/state?role=${encodeURIComponent(S.role)}&persona=${encodeURIComponent(S.persona)}`, { cache:"no-store" });
    if (!r.ok) return;
    const txt = await r.text();
    if (silent && txt === LASTJSON) return;
    const prev = STATE;
    STATE = JSON.parse(txt); LASTJSON = txt;
    if (silent) {
      notify(prev, STATE);
      const a = document.activeElement;
      if (a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT")) return;
    }
    render(!!silent);
  } catch {}
}
function notify(a, b) {
  if (!a || !b || a.role !== b.role) return;
  if (S.role === "carer" && b.updates && b.updates[0] && (!a.updates || !a.updates[0] || a.updates[0].text !== b.updates[0].text)) {
    toast(b.updates[0].text, "bell"); try { navigator.vibrate && navigator.vibrate(120); } catch {}
  }
  if (S.role === "staff" && b.travel.helpRequested && !b.travel.helpAcked && !a.travel.helpRequested) toast("Help requested", "alert");
  if (S.role === "passenger" && b.travel && a.travel) {
    if (b.travel.stage > a.travel.stage) toast("Handover confirmed");
    if (b.travel.helpAcked && !a.travel.helpAcked) toast("Help is on the way", "hand");
  }
}
async function act(type, payload = {}, okMsg) {
  if (BUSY) return;
  BUSY = type; render(true);
  try {
    const r = await fetch("/api/journey/action", { method:"POST", headers:{ "content-type":"application/json" }, body:JSON.stringify({ role:S.role, persona:S.persona, type, ...payload }) });
    if (r.ok) { const txt = await r.text(); STATE = JSON.parse(txt); LASTJSON = txt; if (okMsg) toast(okMsg); }
    else toast(r.status === 429 ? "Busy, try again" : "Something went wrong", "alert");
  } catch { toast("You're offline", "alert"); }
  finally { BUSY = null; render(true); }
}
async function loadFlights() {
  FLIGHTS = null;
  try { const r = await fetch("/api/flights", { cache:"no-store" }); FLIGHTS = r.ok ? await r.json() : { error:true }; }
  catch { FLIGHTS = { error:true }; }
  render(true);
}

/* ================= session ================= */
function enter(role, persona) {
  S.role = role; S.persona = persona || S.persona; S.tab = TABS[role][0][0]; S.sub = null; S.sheet = null;
  STATE = null; LASTJSON = "";
  render();
  fetchState();
  if (role === "staff" && !FLIGHTS) loadFlights();
  clearInterval(POLL);
  POLL = setInterval(() => { if (!BUSY && !document.hidden) fetchState(true); }, 4000);
}

      ${p.medif ? `<div class="card warn note sm">${ic("alert", 18)}<div>${esc(p.medifMessage)}</div></div>` : ""}
      <div class="row">
        ${p.savedToMembership ? "" : `<div class="grow">${abtn("saveProfile", "Save", "ghost")}</div>`}
        <div class="grow"><button class="btn" data-a="sub" data-v="booking">Next</button></div>
      </div>` : ""}`;
}
function pBooking() {
  const s = STATE, p = s.profile, b = s.booking, per = s.persona;
  return `
        ${flightCard(per, b)}
    ${p.codes.length ? `
      <div class="card">
        <div class="row between"><div class="h3">Services</div>${b.booked ? `<span class="pill ok">${ic("check", 13, 2.4)}Added</span>` : ""}</div>
        <div class="chips mt12">${p.codes.map((c) => `<span class="code">${esc(c.code)}</span>`).join("")}</div>
      </div>
      ${b.booked ? `<button class="btn" data-a="sub" data-v="brief">Next</button>` : abtn("applyAndBook", "Add to booking")}`
    : `<button class="btn sec" data-a="sub" data-v="needs">Add your needs first</button>`}`;
}
function pBrief() {
  const s = STATE, pl = s.plan;
  if (!pl.confirmed) return `<button class="btn sec" data-a="sub" data-v="booking">Add to booking first</button>`;
  const ok = pl.brief.status === "approved";
  return `
    <div class="card">
      <div class="row between"><div class="h3">For staff</div>${statusPill(pl.helpCard.status)}</div>
      <ul class="ul mt12">${pl.helpCard.lines.map((l) => `<li>${ic("check", 16, 2.2)}<span>${esc(l)}</span></li>`).join("")}</ul>
    </div>
    <div class="card">
      <div class="row between"><div class="h3">For crew</div>${statusPill(pl.brief.status)}</div>
      <textarea id="briefEdit" class="mt12" rows="4" aria-label="Crew brief">${esc(pl.brief.text)}</textarea>
    </div>
    ${ok ? `<button class="btn" data-a="tab" data-v="journey">Travel day</button>` : abtn("approveBriefAndCard", "Approve")}
    ${s.profile.codes.some((c) => c.code === "PREBOARD") ? "" : abtn("changePlan", "Add quiet room", "ghost")}`;
}
function pJourney() {
  const s = STATE, t = s.travel, n = s.stages.length, cur = Math.min(t.stage, n);
  if (t.stage >= n) return `${hero("Journey")}${doneCard("You've arrived")}<div class="card">${timeline(s.stages, n)}</div>`;
  return `
    ${hero("Journey")}
    ${swapBanner(t.aircraftSwap)}
    ${stageCard(s, cur, n)}
    ${t.helpRequested
      ? `<div class="card ${t.helpAcked ? "tint" : "warn"} note">${ic(t.helpAcked ? "hand" : "bell", 20)}<b>${t.helpAcked ? "Help is on the way" : "Staff notified"}</b></div>`
      : abtn("requestHelp", `${ic("hand", 20)}I need help`, "jade")}
    <div class="card">${timeline(s.stages, cur)}</div>`;
}
function pAsk() {
  const s = STATE;
  const chips = `<div class="chips">
      <button class="chip" data-a="askq" data-v="Where can we wait somewhere quiet?">Quiet places</button>
      <button class="chip" data-a="askq" data-v="Can I bring my folding wheelchair?">Wheelchair</button>
      <button class="chip" data-a="askq" data-v="Can I bring a lithium battery?">Batteries</button>
    </div>`;
  return `
    ${hero("Ask")}
    ${s.chat.length ? `<div class="chat">${s.chat.map((m) => `
      <div class="bub ${m.from === "me" ? "me" : m.from === "human" ? "human" : "ai"}">
        ${m.from === "human" ? `<div class="who">Specialist</div>` : ""}${esc(m.text)}
        ${m.source && m.from !== "me" ? `<div class="mt8"><span class="pill jade" style="font-size:11.5px">${ic("log", 12)}${esc(m.source)}</span></div>` : ""}
      </div>`).join("")}${BUSY === "ask" ? `<div class="bub ai"><span class="spin" style="display:inline-block;color:var(--muted)"></span></div>` : ""}</div>` : chips}`;
}
function composer() {
  return `<form class="composer" id="askForm"><input id="askQ" placeholder="Ask a question" autocomplete="off" ${BUSY ? "disabled" : ""}><button class="sendbtn" type="submit" aria-label="Send" ${BUSY ? "disabled" : ""}>${ic("send", 18)}</button></form>`;
}
function pPrivacy() {
  const s = STATE, c = s.consent, per = s.persona;
  const sw = (k, t) => `<button class="rowi" data-a="consent" data-v="${k}" role="switch" aria-checked="${c[k]}"><div class="grow ttl">${t}</div><span class="sw ${c[k] ? "on" : ""}"></span></button>`;
  return `
    ${hero("Privacy")}
    <div class="card pad0"><div class="rows">
      ${sw("carer", `Share progress with ${esc(per.carer)}`)}
      ${sw("crew", "Share brief with crew")}
      ${sw("ai", "Use AI")}
    </div></div>
    <div class="sec-title"><div class="h2">Access log</div></div>
    <div class="card pad0"><div class="rows">
      ${s.accessLog.length ? s.accessLog.slice(0, 6).map((a) => `<div class="rowi" style="align-items:flex-start"><span class="xs muted" style="width:38px;padding-top:2px;font-variant-numeric:tabular-nums">${esc(a.t)}</span><div class="grow"><div class="sm">${esc(a.who)}</div><div class="xs muted">${esc(a.what)}</div></div></div>`).join("")
        : `<div class="rowi sm muted">None yet</div>`}
    </div></div>
    ${s.profile.status !== "none" ? `<button class="btn ghost" data-a="deleteProfile" style="color:var(--red)">${ic("trash", 18)}Delete my needs</button>` : ""}`;
}

/* ================= carer ================= */
function cLive() {
  const s = STATE, per = s.persona, t = s.travel, n = s.stages.length, cur = Math.min(t.stage, n);
  return `
    ${hero(esc(short(per.passenger)))}
    <div class="pass">${scene("pass")}
      <div class="row"><span class="pill glass">${ic("plane", 13)}${esc(per.flight)}</span><span class="sm" style="opacity:.9">${esc(per.route)}</span></div>
      <div class="h2 mt16" style="color:#fff;font-size:22px">${esc(t.stageName)}</div>
      <div class="progress mt16"><i style="width:${(cur / n) * 100}%"></i></div>
      <div class="xs mt8" style="opacity:.85">${cur} of ${n} handovers</div>
    </div>
    ${t.aircraftSwap ? `<div class="card warn note sm">${ic("swap", 18)}<div>Aircraft changed. Plan re-checked.</div></div>` : ""}
    <div class="card">${timeline(s.stages, cur, { owner:true, noTime:true })}</div>
    <div class="note xs muted" style="padding:0 4px">${ic("lock", 15)}<span>Progress only. Needs stay private.</span></div>`;
}
function cUpdates() {
  const s = STATE;
  return `
    ${hero("Updates")}
    ${s.updates.length ? `<div class="card pad0"><div class="rows">${s.updates.map((u, i) => `
      <div class="rowi" style="align-items:flex-start"><span class="xs muted" style="width:38px;padding-top:2px;font-variant-numeric:tabular-nums">${esc(u.t)}</span><div class="grow sm">${esc(u.text)}</div></div>`).join("")}</div></div>`
    : `<div class="card empty"><div class="ico-tile">${ic("bell", 24)}</div><div class="sm">No updates yet</div></div>`}`;
}
function cPaused() {
  return `${hero("Journey")}<div class="card empty"><div class="ico-tile">${ic("pause", 24)}</div><div class="h3" style="color:var(--ink)">Sharing paused</div></div>`;
}

/* ================= ground staff ================= */
function sPassenger() {
  const s = STATE, p = s.profile, t = s.travel, n = s.stages.length, per = s.persona, b = s.booking;
  const st = s.stages[Math.min(t.stage, n - 1)];
  return `
    ${hero("Passenger")}
    ${t.helpRequested && !t.helpAcked ? `<div class="card alert"><div class="note">${ic("alert", 20)}<div class="grow"><b>Help requested</b><div class="xs mt4">${esc(st.name)}</div></div></div><div class="mt12">${abtn("ackHelp", "On my way", "danger")}</div></div>` : ""}
    <div class="card row">
      <div class="avatar" style="width:46px;height:46px;font-size:15px">${initials(per.passenger)}</div>
      <div class="grow"><div class="h3">${esc(per.passenger)}</div><div class="xs muted">${esc(b.flight)} · Seat ${esc(b.seat)}</div></div>
      ${t.stage < n ? `<span class="pill jade">${esc(st.name)}</span>` : `<span class="pill ok">Arrived</span>`}
    </div>
    ${s.planChange ? `<div class="card tint note sm">${ic("info", 18)}<div>${esc(s.planChange)}</div></div>` : ""}
    <div class="card">
      <div class="row between"><div class="h3">Services</div>${p.status === "verified" ? statusPill("verified", "Confirmed") : p.status === "draft" ? `<span class="pill amber"><span class="dot"></span>To confirm</span>` : ""}</div>
      ${p.status === "draft" && p.redacted ? `<div class="redact mt12">${marks(p.redacted)}</div>` : ""}
      <div class="col mt8">
        ${p.codes.length ? p.codes.map((c, i) => `<div class="row" style="padding:9px 0;border-top:${i ? "1px solid var(--line-2)" : "0"}"><span class="code">${esc(c.code)}</span><div class="sm ink2 grow">${esc(c.desc)}</div>${p.status === "draft" && p.codes.length > 1 ? `<button class="iconbtn" style="width:30px;height:30px" data-a="removeCode" data-v="${i}" aria-label="Remove ${esc(c.code)}">${ic("x", 16)}</button>` : ""}</div>`).join("")
          : `<div class="sm muted mt4">None yet</div>`}
      </div>
      ${p.medif ? `<div class="card warn note mt12 sm">${ic("alert", 18)}<div>${esc(p.medifMessage)}</div></div>` : ""}
      ${p.status === "draft" ? `<div class="mt12">${abtn("confirmCodes", "Confirm")}</div>` : ""}
    </div>
    ${s.helpCard.lines.length ? `
      <div class="card">
        <div class="row between"><div class="h3">How to help</div>${statusPill(s.helpCard.status)}</div>
        <ul class="ul mt12">${s.helpCard.lines.map((l) => `<li>${ic("check", 16, 2.2)}<span>${esc(l)}</span></li>`).join("")}</ul>
      </div>` : ""}`;
}
function sHandover() {
  const s = STATE, t = s.travel, n = s.stages.length, cur = Math.min(t.stage, n);
  if (t.stage >= n) return `${hero("Handover")}${doneCard("All handovers complete")}`;
  const next = s.stages[cur + 1];
  return `
    ${hero("Handover")}
    ${stageCard(s, cur, n)}
    ${abtn("completeHandover", `${ic("check", 18, 2.4)}Confirm handover`)}
    ${next ? `<div class="sm muted" style="text-align:center">Next: ${esc(next.name)}</div>` : ""}
    <div class="card">${timeline(s.stages, cur, { owner:true })}</div>`;
}
function sFlights() {
  const F = FLIGHTS;
  const head = hero("Departures");
  if (!F) return `${head}<div class="card empty"><span class="spin" style="display:inline-block;color:var(--teal)"></span></div>`;
  if (F.error) return `${head}<div class="card empty"><div class="sm">Airport data unavailable</div><div class="mt12"><button class="btn sec small" data-a="flights">Retry</button></div></div>`;
  const h = F.hourly || [], max = Math.max(1, ...h), peak = h.indexOf(Math.max(...h));
  return `
    ${head}
    <div class="kv">
      <div class="kpi"><span>Cathay flights</span><b>${F.total}</b></div>
      <div class="kpi"><span>To London</span><b>${(F.london || []).length}</b></div>
    </div>
    <div class="card">
      <div class="row between"><div class="h3">By hour</div><span class="xs muted">${esc(F.date)}</span></div>
      <div class="bars">${h.map((v, i) => `<i class="${i === peak ? "hi" : ""}" style="height:${(v / max) * 100}%" title="${String(i).padStart(2, "0")}:00 · ${v}"></i>`).join("")}</div>
      <div class="axis"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>
    </div>
    ${(F.london || []).length ? `<div class="card"><div class="h3">To London</div>
      <table class="tbl mt8"><tr><th>Time</th><th>Flight</th><th>Gate</th><th>Status</th></tr>
      ${F.london.slice(0, 8).map((f) => `<tr><td>${esc(f.time)}</td><td>${esc(f.flight)}</td><td>${esc(f.gate || "—")}</td><td class="muted">${esc(f.status)}</td></tr>`).join("")}</table></div>` : ""}
    <div class="xs muted" style="padding:0 4px">Source: HKIA open data, DATA.GOV.HK</div>`;
}

/* ================= shell ================= */
const SUBTITLES = { needs:"Your needs", booking:"Booking", brief:"Crew brief" };
function renderTop() {
  const top = $("#top");
  top.style.display = "flex";
  if (S.sub) {
    top.className = "top plain";
    top.innerHTML = `<button class="iconbtn" data-a="back" aria-label="Back">${ic("chevL", 22, 2)}</button><div class="grow t1">${SUBTITLES[S.sub] || ""}</div><img class="cx-mini" src="/logo-jade.png" alt="Cathay Pacific">`;
    return;
  }
  top.className = "ctl";
  const role = S.locked
    ? `<span class="glass">${ROLES[S.role].label}</span>`
    : `<label class="glass rolesel"><span>${ROLES[S.role].label}</span>${ic("chevR", 15, 2.2)}<select id="roleSel" aria-label="View as">${Object.entries(ROLES).map(([k, r]) => `<option value="${k}" ${k === S.role ? "selected" : ""}>${r.label}</option>`).join("")}</select></label>`;
  top.innerHTML = `${role}${S.locked ? "" : `<button class="glass round" data-a="menu" aria-label="Demo settings">${ic("more", 20, 2.2)}</button>`}`;
}
function hero(title, big) {
  const per = STATE && STATE.persona;
  return `<div class="hero2 ${big ? "big" : ""}">
    <img class="cx" src="/logo-jade.png" alt="Cathay Pacific">
    ${big ? `<div class="hi"><div class="hello">${title}</div></div>`
          : `<div class="ht">${title}</div>`}
  </div>`;
}
function renderTabs() {
  const el = $("#tabs");
  if (S.sub) { el.style.display = "none"; return; }
  el.style.display = "flex";
  const t = STATE && STATE.travel;
  const badge = (id) => !!t && (
    (S.role === "staff" && id === "passenger" && t.helpRequested && !t.helpAcked) ||
    (S.role === "passenger" && id === "home" && STATE.plan && STATE.plan.brief.status === "draft"));
  el.innerHTML = TABS[S.role].map(([id, icon, label]) => `
    <button class="tab ${S.tab === id ? "on" : ""}" data-a="tab" data-v="${id}" aria-current="${S.tab === id}">
      ${ic(icon, 22, S.tab === id ? 2.1 : 1.7)}<span>${label}</span>${badge(id) ? `<span class="badge"></span>` : ""}
    </button>`).join("");
}
function body() {
  const s = STATE;
  if (S.role === "passenger") {
    if (S.sub === "needs") return pNeeds();
    if (S.sub === "booking") return pBooking();
    if (S.sub === "brief") return pBrief();
    return { home:pHome, journey:pJourney, ask:pAsk, privacy:pPrivacy }[S.tab]();
  }
  if (S.role === "carer") return s.paused ? cPaused() : S.tab === "updates" ? cUpdates() : cLive();
  return { passenger:sPassenger, handover:sHandover, flights:sFlights }[S.tab]();
}
function renderLayer() {
  const L = $("#layer");
  if (!S.sheet) { L.innerHTML = ""; return; }
  L.innerHTML = `<div class="scrim" data-a="close-bg"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${S.sheet === "qr" ? sheetQR() : sheetMenu()}</div></div>`;
}
function render(keep) {
  const sc = $("#screen"), y = sc.scrollTop;
  renderTop(); renderTabs(); renderLayer();
  if (!STATE || STATE.role !== S.role) { sc.innerHTML = `<div class="card empty" style="margin-top:60px"><span class="spin" style="display:inline-block;color:var(--teal)"></span></div>`; $("#composer").innerHTML = ""; return; }
  sc.innerHTML = body();
  const ask = S.role === "passenger" && S.tab === "ask" && !S.sub;
  $("#composer").innerHTML = ask ? composer() : "";
  sc.scrollTop = ask ? sc.scrollHeight : keep ? y : 0;
}

/* ================= events ================= */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]");
  if (!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  if (a === "close-bg") { if (e.target === el) { S.sheet = null; renderLayer(); } return; }
  switch (a) {
    case "menu": S.sheet = "menu"; renderLayer(); break;
    case "qr": S.sheet = "qr"; renderLayer(); break;
    case "copy": navigator.clipboard && navigator.clipboard.writeText(location.origin + "/"); toast("Link copied"); break;
    case "reset": S.sheet = null; renderLayer(); S.sub = null; act("reset", {}, "Demo reset"); break;
    case "tab": S.tab = v; S.sub = null; render(); break;
    case "sub": S.sub = v; render(); break;
    case "back": S.sub = null; render(); break;
    case "flights": loadFlights(); break;
    case "oxygen": { const t = $("#rawNeeds"); if (!/oxygen/i.test(t.value)) t.value = t.value.trim() + " Also needs oxygen on board."; break; }
    case "askq": act("ask", { question:v }); break;
    case "consent": act("consent", { key:v }); break;
    case "removeCode": act("removeCode", { index:Number(v) }); break;
    case "matchProfile": act("matchProfile", { text:$("#rawNeeds").value }); break;
    case "saveProfile": act("saveProfile", {}, "Saved"); break;
    case "applyAndBook": act("applyAndBook", {}, "Added to booking"); break;
    case "approveBriefAndCard": act("approveBriefAndCard", { briefText:$("#briefEdit").value }, "Approved"); break;
    case "changePlan": act("changePlan", { note:"Quiet room before boarding" }, "Quiet room added"); break;
    case "deleteProfile": if (confirmDelete()) act("deleteProfile", {}, "Deleted"); break;
    case "startTravel": act("startTravel"); break;
    case "requestHelp": act("requestHelp"); break;
    case "ackHelp": act("ackHelp", {}, "Passenger notified"); break;
    case "confirmCodes": act("confirmCodes", {}, "Confirmed"); break;
    case "completeHandover": act("completeHandover", {}, "Handover confirmed"); break;
  }
});
function confirmDelete() {
  // Two-tap confirm instead of a blocking browser dialog
  if (confirmDelete.armed) { confirmDelete.armed = false; return true; }
  confirmDelete.armed = true; toast("Tap again to delete", "trash");
  setTimeout(() => (confirmDelete.armed = false), 3000);
  return false;
}
document.addEventListener("change", (e) => {
  if (e.target.id === "roleSel") enter(e.target.value, S.persona);
  if (e.target.id === "travSel") enter(S.role, e.target.value);
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "askForm") return;
  e.preventDefault();
  const q = $("#askQ").value.trim();
  if (q) act("ask", { question:q });
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.sheet) { S.sheet = null; renderLayer(); } });

// Opens straight into the demo. Judge links: /?as=carer&p=chan (no role switcher, no reset).
(function start() {
  const q = new URLSearchParams(location.search), as = q.get("as"), p = q.get("p");
  if (as && ROLES[as]) S.locked = true;
  enter(ROLES[as] ? as : "passenger", TRAVELLERS[p] ? p : "chan");
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>

</body>
</html>
