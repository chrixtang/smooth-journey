steps:
  - name: "node:24-alpine"
    entrypoint: "npm"
    args: ["ci"]

  - name: "node:24-alpine"
    entrypoint: "npm"
    args: ["test"]

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/smooth-journey:${COMMIT_SHA}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/smooth-journey:${COMMIT_SHA}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE}"
      - "--image"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/smooth-journey:${COMMIT_SHA}"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--min-instances=1"
      - "--max-instances=1"
      - "--set-env-vars"
      - "MODEL_ID=${_MODEL_ID},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=${_VERTEX_REGION}"

substitutions:
  _SERVICE: "smooth-journey"
  _REGION: "asia-east2"
  _VERTEX_REGION: "us-central1"
  _REPO: "smooth-journey"
  _MODEL_ID: "gemini-2.5-flash"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/smooth-journey:${COMMIT_SHA}"
